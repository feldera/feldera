name: Adapter Tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the workflow run that uploaded the artifact"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  adapter-tests:
    if: ${{ !contains(vars.CI_SKIP_JOBS, 'adapter-tests') }}
    name: Test Adapters
    permissions:
      actions: read
      contents: read
      id-token: write
    # The suite runs in 3 to 10 minutes. Without a bound, a test that blocks
    # instead of failing holds a runner for the 6 hour default and stalls the
    # merge queue behind it; the cancel-if-* sentinels cannot help, because a
    # job that hangs never reports failure.
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: [gke-runners-amd64]
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: [gke-runners-arm64]
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container:
      image: us-central1-docker.pkg.dev/feldera-ci/ghcr-remote/feldera/feldera-dev:sha-6f8e388fcd3b56c72a9305f108ae43dd07e3897e
    services:
      postgres:
        image: debezium/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:latest
      iceberg-rest:
        image: apache/iceberg-rest-fixture:1.9.1@sha256:1cd0b86579b423cf260508bc8bdbb0220268f2447b86ddef71482baf74aca1d7
        env:
          CATALOG_WAREHOUSE: gs://feldera-ci-test-feldera-ci/iceberg-follow
          # Keep this on a file. In-memory sqlite gives each connection its own
          # empty database, and the catalog loses its tables.
          CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_rest.db
          CATALOG_IO__IMPL: org.apache.iceberg.gcp.gcs.GCSFileIO
          # Java takes a quarter of `--memory` as heap, and 128m killed this
          # catalog. `JAVA_OPTS` does nothing: the entrypoint is `java -jar`.
          JAVA_TOOL_OPTIONS: -Xmx512m
        options: >-
          --memory=1g
          --health-cmd "curl -fsS 'http://localhost:8181/v1/config?warehouse=gs://feldera-ci-test-feldera-ci/iceberg-follow' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download Test Binaries
        uses: ./.github/actions/download-artifact-retry
        with:
          name: feldera-test-binaries-${{ matrix.target }}
          path: build
          run-id: ${{ github.event.inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Remove if https://github.com/actions/upload-artifact/issues/38 ever gets fixed
      - name: Make binaries executable
        run: chmod +x ./build/*

      # Not a service container: the image's redpanda.yaml advertises
      # 127.0.0.1, so clients that bootstrap via the `redpanda` hostname get
      # redirected to their own container. Rewriting the advertised address
      # needs a command override, which GHA services don't support.
      - name: Start Redpanda broker
        run: |
          docker run -d --name redpanda --network ${{ job.container.network }} \
            --cpuset-cpus 0-1 --entrypoint sh ghcr.io/feldera/redpanda-ci:v24 -c '
              sed "s/127.0.0.1/redpanda/" /etc/redpanda/redpanda.yaml > /tmp/redpanda.yaml
              exec /opt/redpanda/bin/redpanda -c 2 --redpanda-cfg /tmp/redpanda.yaml'

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.6.5"

      - name: Install python deps
        run: |
          uv venv
          uv pip install -r ../iceberg/src/test/requirements.ci.txt
        working-directory: crates/adapters

      - name: Wait for Redpanda broker
        run: |
          for _ in $(seq 1 30); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -q "Healthy:.*true" && exit 0
            sleep 2
          done
          echo "redpanda did not become healthy" >&2
          docker logs redpanda >&2
          exit 1

      - name: Configure AWS Credentials
        if: ${{ vars.CI_DRY_RUN != 'true' && vars.ICEBERG_TEST_ROLE != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.ICEBERG_TEST_ROLE }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.ICEBERG_TEST_REGION }}

      # Pubsub tests are only supported on x86_64, see below
      - name: Run adapters tests
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        run: |
          source .venv/bin/activate
          ../../build/dbsp_adapters-* --skip pubsub
        working-directory: crates/adapters
        shell: bash
        env:
          RUST_BACKTRACE: 1
          # Cap libtest parallelism at the runner core budget. Adapter tests
          # share the pod with postgres/redpanda/redis sidecars; if those start
          # starving we can lower CI_RUNNER_CORES or switch this to its own var.
          RUST_TEST_THREADS: ${{ vars.CI_RUNNER_CORES || 20 }}
          # Service containers live on the job's docker network under the
          # dind runners and are addressed by service name, not localhost.
          REDIS_URL: redis://redis:6379/0
          DYNAMODB_ENDPOINT: http://dynamodb:8000
          # Pinned: the Iceberg credentials step exports AWS_REGION.
          DYNAMODB_REGION: us-east-1
          POSTGRES_URL: postgres://postgres:password@postgres:5432
          REDPANDA_BROKERS: redpanda
          FELDERA_ICEBERG_REST_URI: http://iceberg-rest:8181
          FELDERA_ICEBERG_WAREHOUSE: gs://feldera-ci-test-feldera-ci/iceberg-follow
          # The bucket is shared and both matrix legs run at once.
          FELDERA_ICEBERG_NAMESPACE: follow_${{ github.run_id }}_${{ matrix.arch }}
          # The tests shell out to a pyiceberg writer; `python3` on PATH
          # lacks pyiceberg.
          FELDERA_ICEBERG_PYTHON: ${{ github.workspace }}/crates/adapters/.venv/bin/python
          # No pubsub emulator runs in this job; the probe sees
          # connection-refused here and the pubsub tests skip.
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8681
          ICEBERG_TEST_REGION: ${{ vars.ICEBERG_TEST_REGION }}
          # The Delta object-store tests, same stores and variables as the
          # Python suite. No credentials: Workload Identity authenticates the
          # runner. Tables the tests write go to the per-run store, which
          # expires objects after 7 days.
          CI_OBJECT_STORE_URI: gs://feldera-ci-test-feldera-ci
          # Long-lived datasets tests only read.
          CI_OBJECT_STORE_INPUTS_URI: gs://feldera-ci-inputs-feldera-ci
          POSTGRES_SSL_URL: postgres://postgres:${{ secrets.ci_postgres_password }}@ci-postgres-internal.postgres.svc.cluster.local:5432/postgres?sslmode=require
          POSTGRES_SSL_CA_PEM: ${{ secrets.ci_postgres_tls_crt }}
          POSTGRES_SSL_VERIFY_HOSTNAME: "false"

      # Detach redpanda before the runner tears down the job network.
      - name: Stop Redpanda broker
        if: always()
        run: docker rm -f redpanda

  # We can't run the pubsub tests on aarch64 because we don't have a
  # arm image for the pubsub emulator:
  # https://github.com/TheKevJames/tools/issues/453
  adapter-tests-pubsub:
    if: ${{ !contains(vars.CI_SKIP_JOBS, 'adapter-tests-pubsub') }}
    name: Test Adapters (PubSub only)
    runs-on: ubuntu-latest-amd64
    # The test binaries link librdkafka dynamically and the dev image carries
    # it. Pulled from ghcr.io directly: this runner lacks the GCP registry
    # identity the gke runners use for the ghcr-remote mirror.
    container:
      image: ghcr.io/feldera/feldera-dev:sha-6f8e388fcd3b56c72a9305f108ae43dd07e3897e
    services:
      pubsub:
        image: ghcr.io/feldera/gcloud-pubsub-emulator:e852273e07
        ports:
          - 8681:8681
        options: >-
          -e PUBSUB_PROJECT1=feldera-test,test_pubsub_input-0
          --health-cmd "nc -z 127.0.0.1 8681"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download Test Binaries
        uses: ./.github/actions/download-artifact-retry
        with:
          name: feldera-test-binaries-x86_64-unknown-linux-gnu
          path: build
          run-id: ${{ github.event.inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Remove if https://github.com/actions/upload-artifact/issues/38 ever gets fixed
      - name: Make binaries executable
        run: chmod +x ./build/*

      - name: Run adapters pubsub tests
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        run: ../../build/dbsp_adapters-* pubsub
        working-directory: crates/adapters
        env:
          RUST_BACKTRACE: 1
          # The job container and the emulator share the job's docker
          # network, so the emulator is addressed by service name.
          PUBSUB_EMULATOR_HOST: pubsub:8681
