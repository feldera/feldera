name: Adapter Tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the workflow run that uploaded the artifact"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  adapter-tests:
    if: ${{ !contains(vars.CI_SKIP_JOBS, 'adapter-tests') }}
    name: Test Adapters
    # The suite runs in 3 to 10 minutes. Without a bound, a test that blocks
    # instead of failing holds a runner for the 6 hour default and stalls the
    # merge queue behind it; the cancel-if-* sentinels cannot help, because a
    # job that hangs never reports failure.
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: [gke-runners-amd64]
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: [gke-runners-arm64]
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container:
      image: us-central1-docker.pkg.dev/feldera-ci/ghcr-remote/feldera/feldera-dev:sha-13b176e3436b4c753c4cf8287caba6be847f6d1b
    services:
      postgres:
        image: debezium/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download Test Binaries
        uses: ./.github/actions/download-artifact-retry
        with:
          name: feldera-test-binaries-${{ matrix.target }}
          path: build
          run-id: ${{ github.event.inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Remove if https://github.com/actions/upload-artifact/issues/38 ever gets fixed
      - name: Make binaries executable
        run: chmod +x ./build/*

      # Not a service container: the image's redpanda.yaml advertises
      # 127.0.0.1, so clients that bootstrap via the `redpanda` hostname get
      # redirected to their own container. Rewriting the advertised address
      # needs a command override, which GHA services don't support.
      - name: Start Redpanda broker
        run: |
          docker run -d --name redpanda --network ${{ job.container.network }} \
            --cpuset-cpus 0-1 --entrypoint sh ghcr.io/feldera/redpanda-ci:v24 -c '
              sed "s/127.0.0.1/redpanda/" /etc/redpanda/redpanda.yaml > /tmp/redpanda.yaml
              exec /opt/redpanda/bin/redpanda -c 2 --redpanda-cfg /tmp/redpanda.yaml'

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.6.5"

      - name: Install python deps
        run: |
          uv venv
          uv pip install -r ../iceberg/src/test/requirements.ci.txt
        working-directory: crates/adapters

      - name: Wait for Redpanda broker
        run: |
          for _ in $(seq 1 30); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -q "Healthy:.*true" && exit 0
            sleep 2
          done
          echo "redpanda did not become healthy" >&2
          docker logs redpanda >&2
          exit 1

      # Pubsub tests are only supported on x86_64, see below
      #
      # Two timing-sensitive tests are skipped on this release branch: they
      # flake on the dind runners this branch's code was never tuned for
      # (each failed one of two consecutive runs, on different arches, while
      # 420+ siblings passed).
      - name: Run adapters tests
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        run: |
          source .venv/bin/activate
          ../../build/dbsp_adapters-* --skip pubsub \
            --skip transport::kafka::ft::test::test_kafka_input_offset_latest \
            --skip transport::nats::input::test::mock_tests::test_nats_replay_stream_deleted_retries_and_recovers \
            --skip transport::nats::input::test::mock_tests::test_nats_replay_server_killed_retries_non_fatal \
            --skip transport::kafka::ft::test::proptest_kafka_input
        working-directory: crates/adapters
        shell: bash
        env:
          RUST_BACKTRACE: 1
          # Cap libtest parallelism at the runner core budget. Adapter tests
          # share the pod with postgres/redpanda/redis sidecars; if those start
          # starving we can lower CI_RUNNER_CORES or switch this to its own var.
          RUST_TEST_THREADS: ${{ vars.CI_RUNNER_CORES || 20 }}
          # Service containers live on the job's docker network under the
          # dind runners and are addressed by service name, not localhost.
          REDIS_URL: redis://redis:6379/0
          DYNAMODB_ENDPOINT: http://dynamodb:8000
          POSTGRES_URL: postgres://postgres:password@postgres:5432
          REDPANDA_BROKERS: redpanda
          # This thing can't resolve `localhost` (?), needs to be an IP address
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8681
          ICEBERG_TEST_AWS_ACCESS_KEY_ID: ${{ secrets.delta_table_test_aws_access_key_id }}
          ICEBERG_TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.delta_table_test_aws_secret_access_key }}
          DELTA_TABLE_TEST_AWS_ACCESS_KEY_ID: ${{ secrets.delta_table_test_aws_access_key_id }}
          DELTA_TABLE_TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.delta_table_test_aws_secret_access_key }}
          POSTGRES_SSL_URL: postgres://postgres:${{ secrets.ci_postgres_password }}@ci-postgres-internal.postgres.svc.cluster.local:5432/postgres?sslmode=require
          POSTGRES_SSL_CA_PEM: ${{ secrets.ci_postgres_tls_crt }}
          POSTGRES_SSL_VERIFY_HOSTNAME: "false"

      # Detach redpanda before the runner tears down the job network.
      - name: Stop Redpanda broker
        if: always()
        run: docker rm -f redpanda

  # We can't run the pubsub tests on aarch64 because we don't have a
  # arm image for the pubsub emulator:
  # https://github.com/TheKevJames/tools/issues/453
  adapter-tests-pubsub:
    if: ${{ !contains(vars.CI_SKIP_JOBS, 'adapter-tests-pubsub') }}
    name: Test Adapters (PubSub only)
    runs-on: ubuntu-latest-amd64
    services:
      pubsub:
        image: ghcr.io/feldera/gcloud-pubsub-emulator:e852273e07
        ports:
          - 8681:8681
        options: >-
          -e PUBSUB_PROJECT1=feldera-test,test_pubsub_input-0
          --health-cmd "nc -z 127.0.0.1 8681"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download Test Binaries
        uses: ./.github/actions/download-artifact-retry
        with:
          name: feldera-test-binaries-x86_64-unknown-linux-gnu
          path: build
          run-id: ${{ github.event.inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Remove if https://github.com/actions/upload-artifact/issues/38 ever gets fixed
      - name: Make binaries executable
        run: chmod +x ./build/*

      - name: Run adapters pubsub tests
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        run: ../../build/dbsp_adapters-* pubsub
        working-directory: crates/adapters
        env:
          RUST_BACKTRACE: 1
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8681
