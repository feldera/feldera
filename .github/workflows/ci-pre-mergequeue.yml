name: Pre Merge Queue Tasks

on:
  pull_request:
    types: [opened, synchronize]

# The pre-commit hooks below hand GITHUB_TOKEN to every build script in the
# tree, so keep it read-only. Nothing here writes through it: the auto-fix
# commit pushes with the App token that the checkout configured.
permissions:
  contents: read

env:
  RUSTC_WRAPPER: sccache
  # sccache: native GCS backend, credentials come from the runner pod via
  # Workload Identity (no secrets).
  SCCACHE_GCS_BUCKET: ${{ vars.SCCACHE_GCS_BUCKET }}
  SCCACHE_GCS_RW_MODE: READ_WRITE
  # sccache cannot cache rustc invocations when incremental is on.
  CARGO_INCREMENTAL: 0

jobs:
  # This job needs to be called main (the same as the ci.yml workflow)
  # because of how merge queues work: https://stackoverflow.com/a/78030618
  main:
    container:
      image: us-central1-docker.pkg.dev/feldera-ci/ghcr-remote/feldera/feldera-dev:sha-6f8e388fcd3b56c72a9305f108ae43dd07e3897e
    runs-on: [gke-runners-amd64]
    steps:
      # Compute the internal-PR boolean once so individual steps can reference
      # it; cheaper to grep and less fragile when triggers expand.
      # Must stay a ${{ }} expression: run steps on the k8s runners execute
      # under plain `sh`, where bash-only tests like [[ ]] fail silently.
      - name: Determine if this is an internal PR
        id: pr-check
        run: echo "internal=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}" >> "$GITHUB_OUTPUT"

      - name: Disable sccache for fork/dependabot PRs (secrets unavailable)
        if: ${{ steps.pr-check.outputs.internal != 'true' }}
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Generate GitHub App token
        if: ${{ steps.pr-check.outputs.internal == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CI_ACCESS_APP_ID }}
          private-key: ${{ secrets.CI_ACCESS_APP_PKEY }}
          permission-contents: write

      - name: Checkout (internal PRs)
        if: ${{ steps.pr-check.outputs.internal == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # This needs to be set to a token to trigger a follow-up workflow
          # in case some changes were corrected.
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout (fork/dependabot PRs)
        if: ${{ steps.pr-check.outputs.internal != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Caching is skipped for fork/dependabot PRs: MinIO secrets aren't
      # available in those contexts.
      - name: Cache uv pre-commit environments
        if: ${{ steps.pr-check.outputs.internal == 'true' }}
        uses: ./.github/actions/feldera-gcs-cache
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/uv
          key: ci-pre-mergequeue-precommit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ci-pre-mergequeue-precommit-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Cargo registry and index
        if: ${{ steps.pr-check.outputs.internal == 'true' }}
        uses: ./.github/actions/feldera-gcs-cache
        with:
          # registry/src excluded — cargo regenerates it from registry/cache.
          path: |
            # Absolute paths: CARGO_HOME is /home/ubuntu/.cargo (feldera-dev image
            # env), while ~ expands to the runner's HOME (/github/home in container
            # jobs), so tilde paths would cache a directory cargo never writes.
            /home/ubuntu/.cargo/registry/cache
            /home/ubuntu/.cargo/registry/index
            /home/ubuntu/.cargo/git/db
          key: ci-pre-mergequeue-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-pre-mergequeue-cargo-${{ runner.os }}-${{ runner.arch }}-

      - run: |
          # Don't build the webconsole for rust checks
          export WEBCONSOLE_BUILD_DIR="$(mktemp -d)"
          touch $WEBCONSOLE_BUILD_DIR/index.html
          pre-commit run --show-diff-on-failure --color=always --all-files
        shell: bash
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        env:
          # The cargo hooks compile the workspace, and postgresql_embedded's
          # build script lists the releases of theseus-rs/postgresql-binaries
          # through the GitHub API. Anonymous calls share the runners' egress
          # address and its 60-per-hour limit, which fails the build with
          # "403 rate limit exceeded"; postgresql_archive sends this token when
          # it is set. Only this step compiles, so only this step gets it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate OpenAPI codegen
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        run: |
          if ! pre-commit run update-api-client --all-files --show-diff-on-failure; then
            echo "::error::The generated API client no longer matches openapi.json. Run 'pre-commit run update-api-client --all-files' and commit the result."
            exit 1
          fi

      - name: Print sccache stats
        run: sccache --show-stats
      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # b863ae1933cb653a53c021fe36dbb774e1fb9403
        # Only attempt auto-fix commits for internal branches (forks and dependabot can't be pushed to)
        if: ${{ always() && steps.pr-check.outputs.internal == 'true' }}
        with:
          commit_message: "[ci] apply automatic fixes"
          commit_user_name: feldera-bot
          commit_user_email: feldera-bot@feldera.com
          commit_author: feldera-bot <feldera-bot@feldera.com>
          commit_options: "--no-verify --signoff"
