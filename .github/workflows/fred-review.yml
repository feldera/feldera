name: fred-review

on:
  pull_request:
    # review once when the PR appears (drafts included) and once more when marked ready;
    types: [opened, ready_for_review]
  # re-run fred on a PR by hand from the Actions tab
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true
        type: number

env:
  PR: ${{ github.event.pull_request.number || inputs.pr }}

# one review at a time per PR;
concurrency:
  group: fred-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  # The trust gate of a public repository.
  # The review job starts only when this job has
  # confirmed the author is a feldera org member.
  gate:
    name: Check the PR author
    # fork PRs get no secrets, so skip them before the token step fails
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.pull_request.user.login, '[bot]'))
    runs-on: ubuntu-latest-amd64
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      author_is_member: ${{ steps.membership.outputs.is_member }}
    steps:
      # a manual run has no PR in its event, so look the PR up the same way for both triggers
      - name: Look up the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '"author=\(.user.login)\nhead_repo=\(.head.repo.full_name)"' >> "$GITHUB_OUTPUT"

      - name: Generate org membership lookup token
        id: app-token-org
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MYTHICAL_FRED_OSS_CLIENT_ID }}
          private-key: ${{ secrets.MYTHICAL_FRED_OSS_PEM }}
          owner: ${{ github.repository_owner }}
          permission-members: read

      - name: Check the PR author is a feldera org member
        id: membership
        env:
          GH_TOKEN: ${{ steps.app-token-org.outputs.token }}
          ORG: ${{ github.repository_owner }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
        run: |
          # forks and bots never get a review, also not by hand
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [[ "$AUTHOR" == *"[bot]" ]]; then
            echo "$AUTHOR / $HEAD_REPO is a fork or a bot; no review"
            echo "is_member=false" >> "$GITHUB_OUTPUT"
          elif gh api --silent "orgs/$ORG/members/$AUTHOR"; then
            echo "$AUTHOR is a member of $ORG"
            echo "is_member=true" >> "$GITHUB_OUTPUT"
          else
            echo "$AUTHOR is not a member of $ORG; no review"
            echo "is_member=false" >> "$GITHUB_OUTPUT"
          fi

  fred-review:
    name: Review the PR
    needs: gate
    if: needs.gate.outputs.author_is_member == 'true'
    runs-on: k8s-dev-amd64
    # no build cache on this runner: crate-scoped checks only, see the prompt
    timeout-minutes: 60
    container:
      image: ghcr.io/feldera/feldera-dev:sha-a112fd877176bba0f4e5f3475853f918b276d1ef
    permissions:
      # only needed for the Anthropic WIF token exchange; all GitHub access goes through the app token
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MYTHICAL_FRED_OSS_CLIENT_ID }}
          private-key: ${{ secrets.MYTHICAL_FRED_OSS_PEM }}
          # owner/repositories omitted: write access stays scoped to this repo only;
          # checks+actions read let the reviewer see CI results and read failing run logs
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read

      - name: Generate read-only clone token
        id: app-token-ro
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MYTHICAL_FRED_OSS_CLIENT_ID }}
          private-key: ${{ secrets.MYTHICAL_FRED_OSS_PEM }}
          # clone-only token covering the repo and the review skills
          repositories: |
            ${{ github.event.repository.name }}
            internal-skills
          permission-contents: read

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token-ro.outputs.token }}
          # a pull_request run checks out the merge ref by default; a manual run must ask for it
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || '' }}
          persist-credentials: false

      - name: Install review skills
        env:
          GH_TOKEN: ${{ steps.app-token-ro.outputs.token }}
        run: |
          for s in feldera-pr-checks good-code good-architecture good-english; do
            gh skill install feldera/internal-skills "$s" --agent claude-code --scope user
          done

      - name: Check review prompt is configured
        env:
          PROMPT: ${{ vars.FRED_REVIEW_PROMPT }}
        run: |
          [ -n "$PROMPT" ] || { echo "vars.FRED_REVIEW_PROMPT is unset or empty"; exit 1; }

      - name: Record the review start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        env:
          # The action stops at the SDK's first result message, and the SDK sends one as soon as
          # Claude ends a turn to wait for a background task. The session then ends green with no
          # review posted. Foreground-only commands keep the session alive until the work is done.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          # crate builds and tests can take longer than the 10 minute default cap
          BASH_MAX_TIMEOUT_MS: "1800000"
        with:
          settings: ${{ vars.CLAUDE_SETTINGS_JSON }}
          anthropic_federation_rule_id: fdrl_0174FBQ1qv4mn5FPEKjDyhea
          anthropic_service_account_id: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_organization_id: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_workspace_id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ steps.app-token.outputs.token }}
          # git identity for any local commit, same as fred-observe; nothing is
          # pushed from here, comments are attributed by the token regardless
          bot_name: mythical-fred-oss[bot]
          bot_id: "319348225"
          # expressions inside a variable value are not expanded, so the run context stays here
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR }}

            ${{ vars.FRED_REVIEW_PROMPT }}
          # the deny list is a cost guard
          # an unset FRED_REVIEW_MODEL falls back to the org-wide FRED_BASE_MODEL
          claude_args: |
            --model ${{ vars.FRED_REVIEW_MODEL || vars.FRED_BASE_MODEL }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash,Edit,Write"
            --disallowedTools "Bash(git push:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(gh run:*),Bash(gh workflow:*),Bash(cargo build --release:*),Bash(docker:*)"
            --max-turns 180

      - name: Check that fred posted something
        # a green run with nothing on the PR looks like a review that found nothing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          bot='mythical-fred-oss[bot]'
          count() { gh api --paginate "repos/$GITHUB_REPOSITORY/$1" \
            --jq "[.[] | select(.user.login == \"$bot\" and (.${2} // \"\") >= \"$SINCE\")] | length" \
            | awk '{s+=$1} END {print s+0}'; }
          n=$(( $(count "issues/$PR/comments" created_at) + $(count "pulls/$PR/comments" created_at) + $(count "pulls/$PR/reviews" submitted_at) ))
          echo "fred posted $n comment(s) or review(s) since $SINCE"
          [ "$n" -gt 0 ] || { echo "::error::Claude finished without posting a review"; exit 1; }

      - name: Report review failure
        # a silent red X is indistinguishable from "nothing found"; say so on the PR
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr comment "$PR" \
            --body "fred-review did not finish; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "could not post failure comment"
