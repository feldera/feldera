name: Upload crates.io packages

permissions:
  contents: read
  id-token: write

# No sccache on this release branch: the branch sees a handful of one-off
# runs, not worth polluting the shared compile cache for.

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to use (ci or release)"
        required: false
        type: string
        default: "release"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (WARNING: Only use for emergency fixes, not for regular releases)"
        required: false
        type: string
      environment:
        description: "Environment to use (ci or release)"
        required: false
        type: string
        default: "release"

jobs:
  deploy:
    runs-on: [gke-runners-amd64]
    environment:
      name: ${{ inputs.environment || 'release' }}
    container:
      image: us-central1-docker.pkg.dev/feldera-ci/ghcr-remote/feldera/feldera-dev:sha-a5ab793b8d261068867b9fdfad3f04157b2536fc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1
        if: ${{ inputs.environment == 'release' }}
        id: auth

      - name: Run cargo publish
        if: ${{ vars.RELEASE_DRY_RUN == 'false' }}
        run: |
          cargo publish ${{ vars.CARGO_PUBLISH_FLAGS }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
