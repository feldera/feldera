name: Upload crates.io packages

permissions:
  contents: read
  id-token: write

env:
  RUSTC_WRAPPER: sccache
  # sccache: native GCS backend, credentials come from the runner pod via
  # Workload Identity (no secrets).
  SCCACHE_GCS_BUCKET: ${{ vars.SCCACHE_GCS_BUCKET }}
  SCCACHE_GCS_RW_MODE: READ_WRITE
  AWS_ACCESS_KEY_ID: "${{ secrets.CI_GCS_HMAC_ACCESS_KEY_ID }}"
  AWS_SECRET_ACCESS_KEY: "${{ secrets.CI_GCS_HMAC_SECRET_ACCESS_KEY }}"

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to use (ci or release)"
        required: false
        type: string
        default: "release"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (WARNING: Only use for emergency fixes, not for regular releases)"
        required: false
        type: string
      environment:
        description: "Environment to use (ci or release)"
        required: false
        type: string
        default: "release"

jobs:
  deploy:
    runs-on: [gke-runners-amd64]
    environment:
      name: ${{ inputs.environment || 'release' }}
    container:
      image: us-central1-docker.pkg.dev/feldera-ci/ghcr-remote/feldera/feldera-dev:sha-6694c709e8a150203f56b80c5058286e4378e2ee
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1
        if: ${{ inputs.environment == 'release' }}
        id: auth

      - name: Run cargo publish
        if: ${{ vars.RELEASE_DRY_RUN == 'false' }}
        run: |
          cargo publish ${{ vars.CARGO_PUBLISH_FLAGS }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
