name: Docs Screenshots

# Captures the web console screenshots in docs.feldera.com and commits the ones that changed
# by more than the threshold in js-packages/web-console/playwright-screenshots.config.ts.
# See js-packages/web-console/screenshots/README.md.
#
# | Trigger      | Shots                               | API backend                                      |
# |--------------|-------------------------------------|--------------------------------------------------|
# | pull_request | profile-viewer                      | none, mocked directly from a support bundle      |
# | dispatch     | all                                 | a pipeline-manager build, from input `image_tag` |
#
# The merge queue checks all shots against the manager of the commit (test-web-console-e2e.yml).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "js-packages/**"
      - ".github/workflows/docs-screenshots.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag of the pipeline manager image, for example latest or sha-<commit>"
        default: "latest"

# The commit step pushes with the App token, not with GITHUB_TOKEN. A push with GITHUB_TOKEN
# does not start the PR checks again.
permissions:
  contents: read

# A newer push to the branch makes the screenshots of an older one obsolete.
concurrency:
  group: docs-screenshots-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  profile-viewer:
    # The job pushes to the PR branch, which is not possible for forks and dependabot.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: [gke-runners-amd64]
    # The pinned image also pins the fonts. Other fonts change the pixels of every shot.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CI_ACCESS_APP_ID }}
          private-key: ${{ secrets.CI_ACCESS_APP_PKEY }}
          permission-contents: write

      # Without git, checkout downloads a tarball, and there is no repository to commit to.
      - name: Install git
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)

      # Check out the branch itself, not the merge commit, so that the new screenshots can be
      # committed on top of it.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        run: |
          npm install -g --prefix /tmp/bun bun@1.3.10
          echo "/tmp/bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture screenshots
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        run: bun run docs-screenshots --project profile-viewer
        working-directory: js-packages/web-console
        env:
          DOCS_SCREENSHOTS_BUILD: 1

      - name: Upload Playwright results
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-screenshots-results
          path: js-packages/web-console/test-results-screenshots
          retention-days: 7

      # The container runs as root, and the workspace belongs to the runner user.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit changed screenshots
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: "[docs] Update web-console screenshots"
          file_pattern: "docs.feldera.com/docs"
          commit_user_name: feldera-bot
          commit_user_email: feldera-bot@feldera.com
          commit_author: feldera-bot <feldera-bot@feldera.com>
          commit_options: "--no-verify --signoff"

  all:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [gke-runners-amd64]
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    services:
      pipeline-manager:
        image: ${{ vars.FELDERA_IMAGE_NAME }}:${{ inputs.image_tag }}
        env:
          AUTH_PROVIDER: none
          RUST_LOG: info
        options: >-
          --health-cmd "curl --fail --silent --max-time 2 http://localhost:8080/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CI_ACCESS_APP_ID }}
          private-key: ${{ secrets.CI_ACCESS_APP_PKEY }}
          permission-contents: write

      - name: Install git
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        run: |
          npm install -g --prefix /tmp/bun bun@1.3.10
          echo "/tmp/bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The app from this branch runs on port 4173 and calls the API on localhost:8080, the same
      # as a local run. So the manager service is forwarded to localhost:8080.
      - name: Forward pipeline-manager to localhost
        run: |
          nohup node -e '
            const net = require("net")
            net.createServer((client) => {
              const upstream = net.connect(8080, "pipeline-manager")
              client.pipe(upstream)
              upstream.pipe(client)
              client.on("error", () => upstream.destroy())
              upstream.on("error", () => client.destroy())
            }).listen(8080, "127.0.0.1")
          ' > /tmp/pipeline-manager-forward.log 2>&1 &
          curl -fsSL --retry 15 --retry-delay 1 --retry-connrefused http://localhost:8080/healthz

      - name: Capture screenshots
        run: bun run docs-screenshots
        working-directory: js-packages/web-console
        env:
          DOCS_SCREENSHOTS_BUILD: 1
          PLAYWRIGHT_API_ORIGIN: http://localhost:8080

      - name: Upload Playwright results
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-screenshots-results
          path: js-packages/web-console/test-results-screenshots
          retention-days: 7

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit changed screenshots
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: "[docs] Update web-console screenshots"
          file_pattern: "docs.feldera.com/docs"
          commit_user_name: feldera-bot
          commit_user_email: feldera-bot@feldera.com
          commit_author: feldera-bot <feldera-bot@feldera.com>
          commit_options: "--no-verify --signoff"
