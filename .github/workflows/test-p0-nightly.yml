            --producer "$GITHUB_SHA" --runtime "$GITHUB_SHA"
          python3 crates/sql/scripts/s4_coverage.py \
            "$RUNNER_TEMP/sql-s4-activation/capture" "$RUNNER_TEMP/sql-s4-activation/replay-s2" \
            "$RUNNER_TEMP/sql-s4-activation/s4-coverage.json"
          python3 crates/sql/scripts/s4_inventory.py crates/sql/s4-inventory.json \
            "$RUNNER_TEMP/sql-s4-activation/s4-coverage.json" "$RUNNER_TEMP/sql-s4-activation/s4-inventory.json" \
            --constructed "$RUNNER_TEMP/sql-s4-construction.json"

      - name: Inventory and replay all observed circuit forms
        if: ${{ vars.CI_DRY_RUN != 'true' }}
