  compare-with-base:
    name: Compare compiler output with the merge base
    runs-on: [gke-runners-amd64]
    container:
      image: us-central1-docker.pkg.dev/feldera-ci/ghcr-remote/feldera/feldera-dev:sha-4c59cc4f717bdd391dd0b00c65b65af61f35aee2
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install the pinned Calcite dependencies
        working-directory: ./sql-to-dbsp-compiler
        env:
          CALCITE_BUILD_DIR: ./calcite
          GRADLE_HOME: /home/ubuntu/.gradle
        run: ./build.sh -pl SQL-compiler

      - name: Compare compiler output
        run: sql-to-dbsp-compiler/compare-with-base.sh

  shadow:
    name: SQL compiler shadow integration
    strategy:
      matrix:
        include:
          - runner: [gke-runners-amd64]
          - runner: [gke-runners-arm64]
    runs-on: ${{ matrix.runner }}

    container:
      image: us-central1-docker.pkg.dev/feldera-ci/ghcr-remote/feldera/feldera-dev:sha-4c59cc4f717bdd391dd0b00c65b65af61f35aee2
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run build.sh
        run: ./build.sh -pl SQL-compiler
        working-directory: ./sql-to-dbsp-compiler
        env:
          CALCITE_BUILD_DIR: ./calcite
          GRADLE_HOME: /home/ubuntu/.gradle

      - name: Run the shadow tests with the local compiler
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export FELDERA_SHADOW_TEST_JAR="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target/sql2dbsp-jar-with-dependencies.jar"
          if [[ ! -s "$FELDERA_SHADOW_TEST_JAR" ]]; then
            echo "The SQL compiler JAR is missing or empty. Check the Maven package output at $FELDERA_SHADOW_TEST_JAR." >&2
            exit 1
          fi
          export WEBCONSOLE_BUILD_DIR="$RUNNER_TEMP/webconsole"
          mkdir -p "$WEBCONSOLE_BUILD_DIR"
          touch "$WEBCONSOLE_BUILD_DIR/index.html"
          cargo build --locked -p sql2dbsp -p feldera-sql-opt-jni
          target_dir=$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)
          export PATH="$target_dir/debug:$PATH"
          cargo test --locked -p pipeline-manager --lib compiler::shadow -- --include-ignored --test-threads=1 | tee "$RUNNER_TEMP/shadow.log"
          if ! grep -Eq '^test .*::real_java_shadow_is_bounded_and_does_not_publish \.\.\. ok$' "$RUNNER_TEMP/shadow.log"; then
            echo "The real Java shadow test did not run. Check the ignored test name and the shadow filter." >&2
            exit 1
          fi
          grep -Eq '^test .*::full_primary_matches_rust_optimizer_shadow_in_both_engines \.\.\. ok$' "$RUNNER_TEMP/shadow.log"
          grep -Eq '^test .*::optimizer_difference_retains_only_the_anonymized_review_bundle \.\.\. ok$' "$RUNNER_TEMP/shadow.log"
