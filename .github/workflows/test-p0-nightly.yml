name: Nightly P0 SQL compiler checks

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      full_determinism:
        description: Replay the complete corpus in independent JVMs
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUSTC_WRAPPER: sccache
  # sccache: native GCS backend, credentials come from the runner pod via
  # Workload Identity (no secrets).
  SCCACHE_GCS_BUCKET: ${{ vars.SCCACHE_GCS_BUCKET }}
  SCCACHE_GCS_RW_MODE: READ_WRITE
  RUST_MIN_STACK: 8388608
  # sccache cannot cache rustc invocations when incremental is on.
  CARGO_INCREMENTAL: 0
  # Cap cargo parallelism at the k8s runner core budget. Java tests drive a
  # Rust build via mvn → sql-to-dbsp; without this cap arm64 runners OOM from
  # too many parallel linkers. Override via the CI_RUNNER_CORES repo variable;
  # the fallback matches the current 20-core pod.
  CARGO_BUILD_JOBS: ${{ vars.CI_RUNNER_CORES || 20 }}
  # Pin Maven's local repo so it matches the cache path regardless of the
  # container runner's $HOME.
  MAVEN_OPTS: -Dmaven.repo.local=/home/ubuntu/.m2/repository

jobs:
  probes:
    name: Compiler probes and corpus replay
    strategy:
      matrix:
        include:
          - runner: [gke-runners-amd64]
          - runner: [gke-runners-arm64]
    runs-on: ${{ matrix.runner }}

    container:
      image: us-central1-docker.pkg.dev/feldera-ci/ghcr-remote/feldera/feldera-dev:sha-4c59cc4f717bdd391dd0b00c65b65af61f35aee2
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Cache Cargo registry
        uses: ./.github/actions/feldera-gcs-cache
        with:
          # Crate downloads only, NOT target/: caching the multi-GB target/
          # trees never paid off, and sccache already caches compiled crates.
          # registry/src is excluded, cargo regenerates it from registry/cache.
          path: |
            # Absolute paths: CARGO_HOME is /home/ubuntu/.cargo (feldera-dev image
            # env), while ~ expands to the runner's HOME (/github/home in container
            # jobs), so tilde paths would cache a directory cargo never writes.
            /home/ubuntu/.cargo/registry/cache
            /home/ubuntu/.cargo/registry/index
            /home/ubuntu/.cargo/git/db
          key: test-java-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-java-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Check crypto dependencies
        run: scripts/validate-crypto-deps.sh

      - name: Cache JVM build dependencies
        uses: ./.github/actions/feldera-gcs-cache
        with:
          path: |
            /home/ubuntu/.gradle
            /home/ubuntu/.m2/repository
            ./sql-to-dbsp-compiler/calcite
          key: test-java-jvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sql-to-dbsp-compiler/calcite_version.env', 'sql-to-dbsp-compiler/**/pom.xml') }}
          restore-keys: |
            test-java-jvm-${{ runner.os }}-${{ runner.arch }}-

      # TODO: Avoid doing this twice and ideally download & reuse the JAR from build-java.yml workflow
      - name: Run build.sh
        run: ./build.sh
        working-directory: ./sql-to-dbsp-compiler
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        env:
          CALCITE_BUILD_DIR: ./calcite
          GRADLE_HOME: /home/ubuntu/.gradle

      - name: Stop gradle daemon
        run: gradle --stop

      - name: Run mvn test
        shell: bash
        run: |
          source calcite_version.env
          if [[ "$CALCITE_BUILD_NEXT" == "y" ]]; then
            calcite_revision="$CALCITE_NEXT_COMMIT"
          else
            calcite_revision="release:$CALCITE_CURRENT"
          fi
          mvn test --no-transfer-progress -B -pl SQL-compiler \
            -Dsurefire.failIfNoSpecifiedTests=false \
            "-Dfeldera.optimizer.trace=$RUNNER_TEMP/sql-optimizer.jsonl" \
            "-Dfeldera.rule.inventory=$RUNNER_TEMP/sql-rule-implementations.json" \
            "-Dfeldera.operator.inventory=$RUNNER_TEMP/sql-validator-operators.json" \
            "-Dfeldera.corpus.dir=$RUNNER_TEMP/sql-corpus" \
            "-Dfeldera.corpus.producer=$GITHUB_SHA" \
            "-Dfeldera.corpus.calcite=$calcite_revision" \
            "-Dfeldera.corpus.runtime=$GITHUB_SHA" \
            "-Dfeldera.diagnostics.dir=$RUNNER_TEMP/sql-diagnostics" \
            "-Dfeldera.diagnostics.producer=$GITHUB_SHA" \
            "-Dfeldera.diagnostics.calcite=$calcite_revision" \
            "-Dfeldera.diagnostics.runtime=$GITHUB_SHA"
        working-directory: ./sql-to-dbsp-compiler
        if: ${{ vars.CI_DRY_RUN != 'true' }}

      - name: Audit frontend constant simplification sites
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          python3 crates/sql/scripts/fold_site_inventory.py > "$RUNNER_TEMP/sql-fold-site-inventory.json"

      - name: Validate compiler corpus and differential harness
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          cargo test --locked -p feldera-sql-difftest -p feldera-sql-ir -p feldera-sql-source -p feldera-sql-lower -p feldera-sql-expr -p feldera-sql-opt -p feldera-sql-opt-jni -p feldera-sql-parser -p feldera-sql-binder -p sql2dbsp
          cargo run --locked -p feldera-sql-difftest --bin sql-difftest -- \
            --validate-corpus "$RUNNER_TEMP/sql-corpus" > "$RUNNER_TEMP/sql-corpus-summary.json"
          cargo run --locked -p feldera-sql-difftest --bin sql-type-probes -- \
            "$RUNNER_TEMP/sql-type-probes.jsonl" > "$RUNNER_TEMP/sql-type-probe-counts.json"
          python3 -m unittest discover -s crates/sql/scripts -p 'test_*.py'
          python3 crates/sql/scripts/diagnostic_census.py \
            "$RUNNER_TEMP/sql-diagnostics" "$RUNNER_TEMP/sql-diagnostic-census.json"
          python3 crates/sql/scripts/diagnostic_direct_assertions.py \
            "$RUNNER_TEMP/sql-diagnostics" "$RUNNER_TEMP/sql-direct-diagnostic-assertions.json"
          cargo run --locked -p feldera-sql-difftest --bin sql-difftest -- \
            --summarize-optimizer "$RUNNER_TEMP/sql-optimizer.jsonl" > "$RUNNER_TEMP/sql-optimizer-census.json"
          python3 crates/sql/scripts/correlation_inventory.py \
            "$RUNNER_TEMP/sql-optimizer.jsonl" "$RUNNER_TEMP/sql-correlation-rule-shapes.json"
          python3 crates/sql/scripts/rule_port_inventory.py \
            "$RUNNER_TEMP/sql-rule-implementations.json" "$RUNNER_TEMP/sql-optimizer-census.json" \
            sql-to-dbsp-compiler/calcite "$RUNNER_TEMP/sql-rule-port-inventory.json"
          python3 crates/sql/scripts/optimizer_stage_contracts.py crates/sql/optimizer-stage-contracts.json \
            "$RUNNER_TEMP/sql-rule-implementations.json" "$RUNNER_TEMP/sql-optimizer-census.json" \
            "$RUNNER_TEMP/sql-optimizer-stage-contracts.json"

      - name: Audit diagnostic templates and Python compiler expectations
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          java_target="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target"
          classpath="$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
          source_root="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/src/main/java"
          java -ea -Xmx1g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.DiagnosticTemplates \
            "$source_root" "$RUNNER_TEMP/sql-diagnostic-templates.json"
          python3 crates/sql/scripts/diagnostic_templates.py \
            "$RUNNER_TEMP/sql-diagnostic-templates.json" "$RUNNER_TEMP/sql-diagnostic-census.json" \
            "$source_root" "$RUNNER_TEMP/sql-diagnostic-template-matches.json"
          python3 crates/sql/scripts/python_diagnostic_inputs.py \
            "$RUNNER_TEMP/sql-diagnostic-census.json" "$RUNNER_TEMP/sql-python-diagnostic-inputs.json"
          java -ea -Xmx1g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.PythonDiagnosticProbe \
            "$RUNNER_TEMP/sql-python-diagnostic-inputs.json" "$RUNNER_TEMP/sql-python-diagnostic-results.jsonl"
          python3 crates/sql/scripts/python_diagnostics.py \
            "$RUNNER_TEMP/sql-python-diagnostic-inputs.json" "$RUNNER_TEMP/sql-python-diagnostic-results.jsonl" \
            "$RUNNER_TEMP/sql-python-diagnostics.json" --require-compiler-matches
          python3 crates/sql/scripts/diagnostic_expectation_attribution.py \
            "$RUNNER_TEMP/sql-diagnostics/java-diagnostics.jsonl" "$RUNNER_TEMP/sql-diagnostic-census.json" \
            "$RUNNER_TEMP/sql-diagnostic-template-matches.json" "$RUNNER_TEMP/sql-python-diagnostic-inputs.json" \
            "$RUNNER_TEMP/sql-python-diagnostic-results.jsonl" "$RUNNER_TEMP/sql-diagnostics/calcite-messages.json" \
            "$RUNNER_TEMP/sql-diagnostic-expectation-attribution.json"

      - name: Run scalar type oracle
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        working-directory: ./sql-to-dbsp-compiler
        run: |
          source calcite_version.env
          if [[ "$CALCITE_BUILD_NEXT" == "y" ]]; then
            calcite_revision="$CALCITE_NEXT_COMMIT"
          else
            calcite_revision="release:$CALCITE_CURRENT"
          fi
          probe_count=$(python3 -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/sql-type-probe-counts.json"))["probes"])')
          mvn test --no-transfer-progress -B -pl SQL-compiler -Dtest=TypeProbeTests,TypeBindingProbeTests \
            "-Dfeldera.probes.input=$RUNNER_TEMP/sql-type-probes.jsonl" \
            "-Dfeldera.probes.output=$RUNNER_TEMP/sql-type-goldens" \
            "-Dfeldera.probes.expectedCount=$probe_count" \
            "-Dfeldera.probes.producer=$GITHUB_SHA" \
            "-Dfeldera.probes.calcite=$calcite_revision" \
            "-Dfeldera.probes.runtime=$GITHUB_SHA"
          cargo run --locked -p feldera-sql-difftest --release --bin sql-difftest -- \
            --validate-probes "$RUNNER_TEMP/sql-type-goldens" > "$RUNNER_TEMP/sql-type-golden-summary.json"

      - name: Compare Rust type inference with the scalar oracle
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          cargo fmt --manifest-path crates/sql/type-derivation-probe/Cargo.toml --all -- --check
          cargo test --locked --manifest-path crates/sql/type-derivation-probe/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path crates/sql/type-derivation-probe/Cargo.toml -- -D warnings
          cargo run --locked --release --manifest-path crates/sql/type-derivation-probe/Cargo.toml -- \
            "$RUNNER_TEMP/sql-type-probes.jsonl" "$RUNNER_TEMP/sql-type-derivation.jsonl"
          python3 crates/sql/scripts/type_derivation_compare.py \
            "$RUNNER_TEMP/sql-type-goldens/golden.jsonl" "$RUNNER_TEMP/sql-type-derivation.jsonl" \
            "$RUNNER_TEMP/sql-type-derivation-comparison" --require-equal
          java_target="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target"
          classpath="$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
          probe_count=$(python3 -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/sql-type-probe-counts.json"))["probes"])')
          java -ea -Xmx2g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.TypeBindingProbe \
            "$RUNNER_TEMP/sql-type-probes.jsonl" "$RUNNER_TEMP/sql-type-bindings" "$probe_count"
          python3 crates/sql/scripts/compare_type_bindings.py \
            "$RUNNER_TEMP/sql-type-bindings/bindings.jsonl" "$RUNNER_TEMP/sql-type-derivation.jsonl" \
            "$RUNNER_TEMP/sql-type-binding-comparison" --require-equal
          java -ea -Xmx2g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.TypeBindingProbe \
            "$RUNNER_TEMP/sql-type-probes.jsonl" "$RUNNER_TEMP/sql-type-s2" "$probe_count" --s2-expressions
          python3 crates/sql/scripts/compare_type_s2.py \
            "$RUNNER_TEMP/sql-type-s2/s2-expressions.jsonl" "$RUNNER_TEMP/sql-type-derivation.jsonl" \
            "$RUNNER_TEMP/sql-type-s2-comparison" --scope all --expected "$probe_count"

      - name: Measure parser coverage
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          python3 crates/sql/scripts/parser_ast_inventory.py > "$RUNNER_TEMP/parser-ast-inventory.json"
          cargo test --locked --manifest-path crates/sql/parser-probe/Cargo.toml
          cargo build --locked --release -p feldera-sql-difftest --bin sql-difftest
          target_dir=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          python3 crates/sql/scripts/determinism.py prepare \
            "$RUNNER_TEMP/sql-corpus" "$RUNNER_TEMP/sql-determinism-input.jsonl" \
            --comparator "$target_dir/release/sql-difftest"
          cargo run --locked --manifest-path crates/sql/parser-probe/Cargo.toml -- \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/parser-corpus"
          cargo run --locked --manifest-path crates/sql/parser-probe/Cargo.toml -- \
            crates/sql/parser-probe/syntax.jsonl "$RUNNER_TEMP/parser-syntax" --include-ast
          source sql-to-dbsp-compiler/calcite_version.env
          if [[ "$CALCITE_BUILD_NEXT" == "y" ]]; then
            calcite_revision="$CALCITE_NEXT_COMMIT"
          else
            calcite_revision="release:$CALCITE_CURRENT"
          fi
          java_target="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target"
          classpath="$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
          java -ea -Xmx2g "-Dfeldera.parser.producer=$GITHUB_SHA" \
            "-Dfeldera.parser.calcite=$calcite_revision" -cp "$classpath" \
            org.dbsp.sqlCompiler.compiler.sql.tools.ParserProbe \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/parser-java-corpus"
          java -ea -Xmx2g "-Dfeldera.parser.producer=$GITHUB_SHA" \
            "-Dfeldera.parser.calcite=$calcite_revision" -cp "$classpath" \
            org.dbsp.sqlCompiler.compiler.sql.tools.ParserProbe \
            crates/sql/parser-probe/syntax.jsonl "$RUNNER_TEMP/parser-java-syntax"
          python3 crates/sql/scripts/compare_parsers.py \
            "$RUNNER_TEMP/parser-corpus" "$RUNNER_TEMP/parser-java-corpus" "$RUNNER_TEMP/parser-corpus-comparison.json" --compare-view-fields
          python3 crates/sql/scripts/compare_parsers.py \
            "$RUNNER_TEMP/parser-syntax" "$RUNNER_TEMP/parser-java-syntax" "$RUNNER_TEMP/parser-syntax-comparison.json"
          parser_target=$(cargo metadata --manifest-path crates/sql/parser-probe/Cargo.toml --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          parser_binary="$parser_target/debug/feldera-parser-probe"
          "$parser_binary" crates/sql/parser-probe/adversarial.jsonl \
            "$RUNNER_TEMP/parser-adversarial-rust" --include-ast
          java -ea -Xmx2g "-Dfeldera.parser.producer=$GITHUB_SHA" \
            "-Dfeldera.parser.calcite=$calcite_revision" -cp "$classpath" \
            org.dbsp.sqlCompiler.compiler.sql.tools.ParserProbe \
            crates/sql/parser-probe/adversarial.jsonl "$RUNNER_TEMP/parser-adversarial-java"
          python3 crates/sql/scripts/compare_parsers.py \
            "$RUNNER_TEMP/parser-adversarial-rust" "$RUNNER_TEMP/parser-adversarial-java" "$RUNNER_TEMP/parser-adversarial-comparison.json" --compare-view-fields \
            --reject-overacceptance 0.64.0/feldera_prototype
          python3 crates/sql/scripts/parser_semantic_corpus.py \
            crates/sql/parser-probe/adversarial.jsonl "$RUNNER_TEMP/parser-adversarial-rust" \
            "$RUNNER_TEMP/parser-adversarial-semantic-inputs"
          python3 crates/sql/scripts/parser_semantic_run.py \
            "$RUNNER_TEMP/parser-adversarial-semantic-inputs" "$RUNNER_TEMP/parser-adversarial-semantic" \
            --classpath "$classpath" --workers 2 --ast-only
          "$parser_binary" crates/sql/parser-probe/semantic.jsonl \
            "$RUNNER_TEMP/parser-semantic-rust" --include-ast
          python3 crates/sql/scripts/parser_semantic_inputs.py \
            crates/sql/parser-probe/semantic.jsonl "$RUNNER_TEMP/parser-semantic-rust" \
            "$RUNNER_TEMP/parser-semantic-pairs.jsonl"
          java -ea -Xmx2g -cp "$classpath" \
            org.dbsp.sqlCompiler.compiler.sql.tools.ParserSemanticProbe \
            "$RUNNER_TEMP/parser-semantic-pairs.jsonl" "$RUNNER_TEMP/parser-semantic-java"
          python3 crates/sql/scripts/parser_semantic_corpus.py \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/parser-corpus" \
            "$RUNNER_TEMP/parser-semantic-corpus-inputs"
          python3 crates/sql/scripts/parser_semantic_run.py \
            "$RUNNER_TEMP/parser-semantic-corpus-inputs" "$RUNNER_TEMP/parser-semantic-corpus" \
            --classpath "$classpath" --workers 2
          python3 crates/sql/scripts/parser_diagnostic_inputs.py \
            "$RUNNER_TEMP/sql-diagnostics" "$RUNNER_TEMP/parser-diagnostics"
          "$parser_binary" "$RUNNER_TEMP/parser-diagnostics/input.jsonl" \
            "$RUNNER_TEMP/parser-diagnostics/rust"
          java -ea -Xmx2g "-Dfeldera.parser.producer=$GITHUB_SHA" \
            "-Dfeldera.parser.calcite=$calcite_revision" -cp "$classpath" \
            org.dbsp.sqlCompiler.compiler.sql.tools.ParserProbe \
            "$RUNNER_TEMP/parser-diagnostics/input.jsonl" "$RUNNER_TEMP/parser-diagnostics/java"
          python3 crates/sql/scripts/compare_parsers.py \
            "$RUNNER_TEMP/parser-diagnostics/rust" "$RUNNER_TEMP/parser-diagnostics/java" \
            "$RUNNER_TEMP/parser-diagnostics/comparison.json"
          python3 crates/sql/scripts/parser_mutations.py \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/parser-mutations"
          "$parser_binary" "$RUNNER_TEMP/parser-mutations/input.jsonl" \
            "$RUNNER_TEMP/parser-mutations/rust"
          java -ea -Xmx2g "-Dfeldera.parser.producer=$GITHUB_SHA" \
            "-Dfeldera.parser.calcite=$calcite_revision" -cp "$classpath" \
            org.dbsp.sqlCompiler.compiler.sql.tools.ParserProbe \
            "$RUNNER_TEMP/parser-mutations/input.jsonl" "$RUNNER_TEMP/parser-mutations/java"
          python3 crates/sql/scripts/compare_parsers.py \
            "$RUNNER_TEMP/parser-mutations/rust" "$RUNNER_TEMP/parser-mutations/java" \
            "$RUNNER_TEMP/parser-mutations/comparison.json" \
            --reject-overacceptance 0.64.0/feldera_prototype
          python3 crates/sql/scripts/parser_keywords.py sql-to-dbsp-compiler/calcite \
            "$parser_binary" "$RUNNER_TEMP/parser-keywords.jsonl" "$RUNNER_TEMP/parser-keyword-inventory.json"
          "$parser_binary" "$RUNNER_TEMP/parser-keywords.jsonl" "$RUNNER_TEMP/parser-keywords-rust"
          java -ea -Xmx2g "-Dfeldera.parser.producer=$GITHUB_SHA" \
            "-Dfeldera.parser.calcite=$calcite_revision" -cp "$classpath" \
            org.dbsp.sqlCompiler.compiler.sql.tools.ParserProbe \
            "$RUNNER_TEMP/parser-keywords.jsonl" "$RUNNER_TEMP/parser-keywords-java"
          python3 crates/sql/scripts/compare_parsers.py \
            "$RUNNER_TEMP/parser-keywords-rust" "$RUNNER_TEMP/parser-keywords-java" "$RUNNER_TEMP/parser-keyword-comparison.json"

      - name: Record case-identified decorrelation shapes
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          java_target="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target"
          classpath="$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
          mkdir -p "$RUNNER_TEMP/sql-correlation/shard-000"
          java -ea -Xmx2g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.CorrelationProbe \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/sql-correlation/shard-000/output"
          python3 crates/sql/scripts/correlation_inventory.py --case-corpus \
            "$RUNNER_TEMP/sql-correlation" "$RUNNER_TEMP/sql-correlation-cases.json"

      - name: Compare S2 and S3 file replay with direct compilation
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          target_dir=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          java_target="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target"
          cargo build --locked --release -p sql2dbsp
          python3 crates/sql/scripts/validate_syntax_diagnostics.py "$RUNNER_TEMP/sql-syntax-diagnostics" \
            --compiler "$target_dir/release/sql2dbsp" \
            --classpath "$java_target/test-classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
          java -ea -cp "$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar" \
            org.dbsp.sqlCompiler.compiler.sql.tools.TableNameConflicts > "$RUNNER_TEMP/table-name-conflicts.txt"
          cmp "$RUNNER_TEMP/table-name-conflicts.txt" crates/sql/sql-binder/src/program/reserved_table_names.txt
          python3 crates/sql/scripts/validate_bound_programs.py "$RUNNER_TEMP/sql-bound-replay" \
            --compiler "$target_dir/release/sql2dbsp" --comparator "$target_dir/release/sql-difftest" \
            --classpath "$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
          classpath="$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
          python3 crates/sql/scripts/measure_submission_binding.py "$RUNNER_TEMP/sql-determinism-input.jsonl" \
            "$RUNNER_TEMP/sql-submissions" --compiler "$target_dir/release/sql2dbsp"
          python3 crates/sql/scripts/compare_submission_binding.py "$RUNNER_TEMP/sql-submissions" \
            "$RUNNER_TEMP/sql-submissions-compared" --comparator "$target_dir/release/sql-difftest" --classpath "$classpath"
          python3 crates/sql/scripts/compare_submission_lowering.py "$RUNNER_TEMP/sql-submissions" \
            "$RUNNER_TEMP/sql-submissions-lowered" --compiler "$target_dir/release/sql2dbsp" \
            --comparator "$target_dir/release/sql-difftest" --classpath "$classpath"
          python3 crates/sql/scripts/validate_s1_lowering.py "$RUNNER_TEMP/sql-lower-s1" \
            --compiler "$target_dir/release/sql2dbsp" --comparator "$target_dir/release/sql-difftest" \
            --classpath "$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
          python3 crates/sql/scripts/validate_region_pass.py "$RUNNER_TEMP/sql-lower-s1/filtered_projection/rust.s2.json" \
            "$RUNNER_TEMP/sql-region-pass" --compiler "$target_dir/release/sql2dbsp" \
            --classpath "$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
