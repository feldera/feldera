          java -ea -Xmx2g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.S1LiteralCorpusImport \
            "$RUNNER_TEMP/sql-literal-corpus-export/cases.jsonl" "$RUNNER_TEMP/sql-literal-corpus-rust/cases.jsonl" \
