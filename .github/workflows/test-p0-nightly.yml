          python3 crates/sql/scripts/validate_s2_replay.py "$RUNNER_TEMP/sql-s3-replay" --stage S3 --through-rust \
            --compiler "$target_dir/release/sql2dbsp" \
            --comparator "$target_dir/release/sql-difftest" \
            --classpath "$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar" \
