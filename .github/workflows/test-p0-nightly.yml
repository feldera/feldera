      - name: Compare the exported CastTests corpus through S2
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          target_dir=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          java_target="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target"
          JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }-Dfeldera.determinism.passCoverage=true" \
          python3 crates/sql/scripts/run_s2_corpus.py \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/sql-s2-corpus" \
            --source-class org.dbsp.sqlCompiler.compiler.sql.simple.CastTests \
            --comparator "$target_dir/release/sql-difftest" \
            --classpath "$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar" \
            --producer "$GITHUB_SHA" --runtime "$GITHUB_SHA"

          python3 crates/sql/scripts/s4_coverage.py \
            "$RUNNER_TEMP/sql-s2-corpus/capture" "$RUNNER_TEMP/sql-s2-corpus/replay-s2" \
            "$RUNNER_TEMP/sql-s2-corpus/s4-coverage.json"
          python3 crates/sql/scripts/s4_inventory.py crates/sql/s4-inventory.json \
            "$RUNNER_TEMP/sql-s2-corpus/s4-coverage.json" "$RUNNER_TEMP/sql-s2-corpus/s4-inventory.json"

      - name: Compare the Rust optimizer with direct Java on the exported population
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          cargo build --release --locked -p feldera-sql-difftest -p feldera-sql-opt-jni
          target_dir=$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)
          java_target="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target"
          python3 crates/sql/scripts/run_s2_corpus.py \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/sql-mixed-optimizer" \
            --full-optimizer-trace --rust-optimizer --require-native-decisions --workers 4 \
            --comparator "$target_dir/release/sql-difftest" \
            --classpath "$java_target/test-classes:$java_target/sql2dbsp-jar-with-dependencies.jar" \
            --producer "$GITHUB_SHA" --runtime "$GITHUB_SHA" --timeout 5400

      - name: Compare Rust optimizer decisions with Java
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        working-directory: ./sql-to-dbsp-compiler
        run: |
          target_dir=$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)
          export LD_LIBRARY_PATH="$target_dir/release${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          tests=(
            AggregateFoldTests CollectExpensiveExpressionsTests EquivalenceTests FlatmapLoweringTests
            InliningTests JoinInputProjectionTests LeftJoinChainsTests LineageTests OptimizerOrderTests
            ProjectionCompositionTests RepeatTests ResolveReferencesTests StaticCandidatesTests
            ShareIndexesTests#sharedIndexesCompareShuffleIdentity
            ShareIndexesTests#aDeepSharedIndexReaderUsesTheRemappedColumn
            ShareIndexesTests#wideIndexFieldsShareADeepProjectionAcrossNarrowIndexes
            ShareIndexesTests#sharedIndexColumnErrorPreservesTheComparisonPrefix
            ShareIndexesTests#sharedIndexDiscoveryKeepsCompletedGroupsAtAFailedKey
            StreamKindTests#validateEachPassResultIncludingChangesToTheSameCircuit
            TemporalKeyTests WaterlineProjectionTests
          )
          comparisons=(
            AggregateFold CanonicalForm ChainWalk ExpressionUses FieldUses Flatmap LimiterApply
            Lineage MapDependencies MapFusionGroups Order ProjectionFields Repeat SharedIndexes
            Statics StreamKinds TemporalKeys ValueNumbers
          )
          flags=()
          for comparison in "${comparisons[@]}"; do
            flags+=("-Dfeldera.optimizer.compareRust${comparison}=true")
          done
          IFS=,
          mvn test --no-transfer-progress -B -pl SQL-compiler \
            "-Dtest=${tests[*]}" "${flags[@]}"

      - name: Audit optimizer option and metadata activation paths
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        shell: bash
        run: |
          target_dir=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          java_target="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target"
          classpath="$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar"
          java -ea -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.S4PassInventory \
            "$RUNNER_TEMP/sql-s4-construction.json"
          python3 crates/sql/scripts/s4_fields.py "$RUNNER_TEMP/sql-s4-construction.json" \
            "$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/src/main/java" "$RUNNER_TEMP/sql-s4-fields.json"
          java -ea -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.S4ActivationInputs \
