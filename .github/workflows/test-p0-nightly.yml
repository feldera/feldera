          java_target="$GITHUB_WORKSPACE/sql-to-dbsp-compiler/SQL-compiler/target"
          python3 crates/sql/scripts/run_determinism.py \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/sql-determinism" \
            --comparator "$comparator" \
            --classpath "$java_target/test-classes:$java_target/classes:$java_target/sql2dbsp-jar-with-dependencies.jar" \
            --producer "$GITHUB_SHA" --runtime "$GITHUB_SHA" --workers 4 --compress --verify-ir

