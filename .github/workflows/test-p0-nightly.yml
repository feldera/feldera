            cargo run --locked --manifest-path crates/sql/sql-rel-model/Cargo.toml --example expression_roundtrip -- \
              "$expression" "$RUNNER_TEMP/sql-expression-graphs-rust/${name%.json}"
          done
          java -ea -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.S1ExpressionTransportProbe \
            verify "$RUNNER_TEMP/sql-expression-graphs-rust" "$RUNNER_TEMP/sql-expression-graphs-import"

          java -ea -Xmx4g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.S1ExpressionCorpusProbe \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/sql-expression-corpus-export"
          cargo run --locked --manifest-path crates/sql/sql-rel-model/Cargo.toml --example expression_corpus_roundtrip -- \
            "$RUNNER_TEMP/sql-expression-corpus-export/cases.jsonl" "$RUNNER_TEMP/sql-expression-corpus-rust"
          java -ea -Xmx2g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.S1ExpressionCorpusImport \
            "$RUNNER_TEMP/sql-expression-corpus-export/cases.jsonl" "$RUNNER_TEMP/sql-expression-corpus-rust/cases.jsonl" \
            "$RUNNER_TEMP/sql-expression-corpus-import"

          java -ea -Xmx4g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.S1ExpressionCorpusProbe \
            "$RUNNER_TEMP/sql-determinism-input.jsonl" "$RUNNER_TEMP/sql-expression-fields-export" --all-fields
          cargo run --locked --manifest-path crates/sql/sql-rel-model/Cargo.toml --example expression_corpus_roundtrip -- \
