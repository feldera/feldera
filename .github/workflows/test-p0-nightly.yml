          java -ea -Xmx2g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.S1TypeCorpusImport \
            "$RUNNER_TEMP/sql-type-corpus-export/cases.jsonl" "$RUNNER_TEMP/sql-type-corpus-rust/cases.jsonl" \
            "$RUNNER_TEMP/sql-type-corpus-import"
          java -ea -Xmx4g -cp "$classpath" org.dbsp.sqlCompiler.compiler.sql.tools.S1LiteralCorpusProbe \
