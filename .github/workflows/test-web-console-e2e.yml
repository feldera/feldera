name: Web Console Integration Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  web-console-integration-tests:
    if: ${{ !contains(vars.CI_SKIP_JOBS, 'web-console-integration-tests') }}
    name: Web Console Integration Tests
    runs-on: [gke-runners-amd64]

    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    services:
      pipeline-manager:
        image: ${{ vars.FELDERA_IMAGE_NAME }}:sha-${{ github.sha }}
        env:
          AUTH_PROVIDER: none
          RUST_LOG: info
          RUST_BACKTRACE: 1
        options: >-
          --health-cmd "curl --fail --silent --max-time 2 http://localhost:8080/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        run: |
          npm install -g --prefix /tmp/bun bun@1.3.10
          echo "/tmp/bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync SvelteKit
        run: bunx svelte-kit sync
        working-directory: js-packages/web-console

      - name: Verify pipeline-manager is reachable
        run: curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused http://pipeline-manager:8080/healthz

      # The browser loads the app over this forward rather than from the service
      # name directly, because Chromium grants a secure context to `localhost`
      # but not to a bare hostname. `crypto.randomUUID`, which the support-bundle
      # handoff calls, is undefined outside one. Forwarding leaves every origin
      # below spelled the same way a local run spells it.
      - name: Forward pipeline-manager to localhost
        run: |
          nohup node -e '
            const net = require("net")
            net.createServer((client) => {
              const upstream = net.connect(8080, "pipeline-manager")
              client.pipe(upstream)
              upstream.pipe(client)
              client.on("error", () => upstream.destroy())
              upstream.on("error", () => client.destroy())
            }).listen(8080, "127.0.0.1")
          ' > /tmp/pipeline-manager-forward.log 2>&1 &
          curl -fsSL --retry 15 --retry-delay 1 --retry-connrefused http://localhost:8080/healthz

      - name: Run vitest integration tests
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        run: bun run test-integration
        working-directory: js-packages/web-console
        env:
          FELDERA_TEST_API_ORIGIN: http://localhost:8080

      - name: Run Playwright e2e tests
        if: ${{ vars.CI_DRY_RUN != 'true' }}
        run: bun run test-e2e
        working-directory: js-packages/web-console
        env:
          PLAYWRIGHT_API_ORIGIN: http://localhost:8080
          PLAYWRIGHT_APP_ORIGIN: http://localhost:8080

