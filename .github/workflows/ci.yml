name: Merge Queue Tasks

on:
  merge_group:
  workflow_dispatch:
  # Nightly full run of main. The `changes` job below can skip jobs in the
  # merge queue; this run ignores it, so a wrong path rule surfaces within a
  # day rather than staying hidden.
  schedule:
    - cron: "0 6 * * *"

jobs:
  # HOW JOBS ARE STRUCTURED IN THIS FILE
  #
  # Each substantive job (build, test, etc.) must have a matching
  # cancel-if-<name>-failed sentinel job in the cancel-if-* section below.
  # GitHub Actions does not cancel sibling jobs when one job fails — they keep
  # running and waste runner time. The sentinels work around this: each one
  # watches a single upstream job and immediately cancels the entire run on
  # failure.
  #
  # A sentinel here watches an `invoke-*` job, which stands for a whole called
  # workflow and reports failure only once every job in it has finished. A
  # called workflow that runs several jobs therefore needs its own sentinel per
  # job, next to those jobs, or one failing job leaves its siblings running.
  # See build-rust.yml and test-integration-platform.yml.
  #
  # IMPORTANT: The sentinel cancel is asynchronous. Any job that must not run
  # when a prior job fails MUST also list that job in its `needs:` field and
  # check its result in its `if:` condition — do not rely on the cancel alone.
  # Example: invoke-tests-web-console-unit runs in parallel with the build
  # jobs, so invoke-build-docker lists it in `needs:` and checks its result in
  # `if:`. Without that explicit gate, the Docker build can start before the
  # cancel propagates and waste expensive runner time.
  #
  # SKIPPING JOBS BY CHANGED PATHS
  #
  # The `changes` job classifies the merge-group diff into buckets (see
  # .github/scripts/classify-changes.sh). Each invoke-* job runs when
  # `all` is true or when one of its buckets is. Every job's `needs` are
  # themselves in its buckets, so a job never waits on a skipped upstream and
  # the implicit success() check on `needs` keeps working. The `main` gate
  # already treats `skipped` as success.
  #
  # Skipping is enforced only when the repository variable
  # CI_PATH_FILTER_ENFORCE is 'true'. Otherwise `all` is forced to true and the
  # job summary reports what would have been skipped, so the rules can be
  # checked against real runs first. Scheduled and dispatched runs, and any
  # PR in the group labelled `ci:full`, always run everything.
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest-amd64
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.classify.outputs.all }}
      docs: ${{ steps.classify.outputs.docs }}
      web_console: ${{ steps.classify.outputs.web_console }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The diff base is on main; the merge-group checkout alone has no
          # history back to it.
          fetch-depth: 0
      - name: Test the classifier
        run: .github/scripts/classify-changes.test.sh
      - name: Classify the diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/classify-changes.sh \
            --enforce "${{ vars.CI_PATH_FILTER_ENFORCE || 'false' }}" \
            --base "${{ github.event.merge_group.base_sha }}" \
            --head "${{ github.event.merge_group.head_sha }}"

  invoke-build-rust:
    name: Build Rust
    needs: [changes]
    # The web console is embedded into pipeline-manager, so frontend changes
    # rebuild Rust.
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.web_console == 'true'
    uses: ./.github/workflows/build-rust.yml
    secrets: inherit

  invoke-build-java:
    name: Build Java
    needs: [changes]
    # Build Docker copies the compiler jar, and the frontend bucket builds
    # the image.
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.web_console == 'true'
    uses: ./.github/workflows/build-java.yml
    secrets: inherit

  invoke-build-docs:
    name: Build Docs
    needs: [changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/build-docs.yml
    secrets: inherit

  invoke-tests-web-console-unit:
    name: Web Console Unit Tests
    needs: [changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.web_console == 'true'
    uses: ./.github/workflows/test-web-console-unit.yml
    secrets: inherit

  invoke-tests-unit:
    name: Unit Tests
    needs: [changes, invoke-build-rust, invoke-build-java]
    if: needs.changes.outputs.all == 'true'
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit

  invoke-tests-adapter:
    name: Adapter Tests
    needs: [changes, invoke-build-rust]
    if: needs.changes.outputs.all == 'true'
    uses: ./.github/workflows/test-adapters.yml
    secrets: inherit

  invoke-build-docker:
    name: Build Docker
    needs: [changes, invoke-build-rust, invoke-build-java, invoke-tests-web-console-unit]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.web_console == 'true'
    uses: ./.github/workflows/build-docker.yml
    secrets: inherit

  invoke-generate-sbom:
    name: Generate SBOMs
    needs: [changes, invoke-build-docker]
    if: needs.changes.outputs.all == 'true'
    uses: ./.github/workflows/generate-sbom.yml
    secrets: inherit

  invoke-tests-web-console-e2e:
    name: Web Console End-to-End Tests
    needs: [changes, invoke-build-docker]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.web_console == 'true'
    uses: ./.github/workflows/test-web-console-e2e.yml
    secrets: inherit

  invoke-tests-integration-platform:
    name: Integration Tests
    needs: [changes, invoke-build-docker]
    if: needs.changes.outputs.all == 'true'
    uses: ./.github/workflows/test-integration-platform.yml
    secrets: inherit

  invoke-tests-integration-runtime:
    name: Integration Tests
    needs: [changes, invoke-build-java]
    if: needs.changes.outputs.all == 'true'
    uses: ./.github/workflows/test-integration-runtime.yml
    # A called workflow gets no more than the calling job grants, and the
    # runtime tests authenticate to the CI instances with an OIDC token.
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  invoke-tests-java:
    name: Java Tests
    needs: [changes, invoke-build-java]
    if: needs.changes.outputs.all == 'true'
    uses: ./.github/workflows/test-java.yml
    secrets: inherit

  invoke-publish-crates-dry-run:
    name: Publish Crates (Dry Run)
    needs: [changes, invoke-build-rust]
    if: needs.changes.outputs.all == 'true'
    uses: ./.github/workflows/publish-crates.yml
    with:
      environment: ci
    secrets: inherit

  cancel-if-tests-web-console-unit-failed:
    name: Cancel if Web Console Unit Tests Failed
    needs: [invoke-tests-web-console-unit]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-build-rust-failed:
    name: Cancel if Rust Build Failed
    needs: [invoke-build-rust]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-build-java-failed:
    name: Cancel if Java Build Failed
    needs: [invoke-build-java]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-build-docs-failed:
    name: Cancel if Docs Build Failed
    needs: [invoke-build-docs]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-tests-unit-failed:
    name: Cancel if Unit Tests Failed
    needs: [invoke-tests-unit]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-tests-adapter-failed:
    name: Cancel if Adapter Tests Failed
    needs: [invoke-tests-adapter]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-build-docker-failed:
    name: Cancel if Docker Build Failed
    needs: [invoke-build-docker]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-tests-web-console-integration-failed:
    name: Cancel if Web Console Integration Tests Failed
    needs: [invoke-tests-web-console-e2e]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-tests-integration-platform-failed:
    name: Cancel if Platform Integration Tests Failed
    needs: [invoke-tests-integration-platform]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-tests-integration-runtime-failed:
    name: Cancel if Runtime Integration Tests Failed
    needs: [invoke-tests-integration-runtime]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-tests-java-failed:
    name: Cancel if Java Tests Failed
    needs: [invoke-tests-java]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  cancel-if-publish-crates-dry-run-failed:
    name: Cancel if Publish Crates Dry Run Failed
    needs: [invoke-publish-crates-dry-run]
    if: failure()
    runs-on: ubuntu-latest-amd64
    permissions:
      actions: write
    steps:
      - name: Cancel workflow
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  # This job needs to be called main (the same as the ci-pre-mergequeue.yml workflow)
  # because of how merge queues work: https://stackoverflow.com/a/78030618
  # and https://github.com/orgs/community/discussions/103114
  main:
    if: always()
    runs-on: ubuntu-latest-amd64
    needs:
      - changes
      - invoke-build-rust
      - invoke-build-java
      - invoke-build-docs
      - invoke-tests-web-console-unit
      - invoke-tests-web-console-e2e
      - invoke-tests-unit
      - invoke-tests-adapter
      - invoke-build-docker
      - invoke-generate-sbom
      - invoke-tests-integration-platform
      - invoke-tests-integration-runtime
      - invoke-tests-java
      - invoke-publish-crates-dry-run
    steps:
      - name: Finalize Workflow
        run: echo "All tasks completed!"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
