name: Post Release Tasks

on:
  release:
    types: [published]

env:
  RUSTC_WRAPPER: sccache
  # sccache: native GCS backend, credentials come from the runner pod via
  # Workload Identity (no secrets).
  SCCACHE_GCS_BUCKET: ${{ vars.SCCACHE_GCS_BUCKET }}
  SCCACHE_GCS_RW_MODE: READ_WRITE
  AWS_ACCESS_KEY_ID: "${{ secrets.CI_GCS_HMAC_ACCESS_KEY_ID }}"
  AWS_SECRET_ACCESS_KEY: "${{ secrets.CI_GCS_HMAC_SECRET_ACCESS_KEY }}"

jobs:
  # Ideally this would just invoke `publish-python.yml`
  #
  # But not yet supported:
  # https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
  # https://github.com/pypa/gh-action-pypi-publish/issues/166
  # https://github.com/pypi/warehouse/issues/11096
  #
  # When this is solved, do this again:
  #  - name: ""
  #    uses: ./.github/workflows/publish-python.yml
  #    secrets: inherit
  publish-python:
    runs-on: ubuntu-latest-amd64
    environment:
      name: release
      url: https://pypi.org/p/feldera
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: ./python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: "python/pyproject.toml"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Build package
        run: |
          uv build
      - name: Publish package
        if: ${{ vars.RELEASE_DRY_RUN == 'false' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: ./python/dist
      - name: Minimize uv cache
        run: uv cache prune --ci

  # Ideally this would just invoke `publish-python.yml`
  #
  # But not yet supported:
  # https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
  # https://github.com/pypa/gh-action-pypi-publish/issues/166
  # https://github.com/pypi/warehouse/issues/11096
  #
  # When this is solved, do this again:
  #  - name: ""
  #    uses: ./.github/workflows/publish-python.yml
  #    secrets: inherit
  publish-dbt-feldera:
    runs-on: ubuntu-latest-amd64
    environment:
      name: release
      url: https://pypi.org/p/dbt-feldera
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: ./python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2
        with:
          version: "0.11.3"
          enable-cache: true
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install and build dbt-feldera
        working-directory: ./python/dbt-feldera
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv build
      - name: Publish dbt-feldera
        if: ${{ vars.RELEASE_DRY_RUN == 'false' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: ./python/dbt-feldera/dist
      - name: Minimize uv cache
        working-directory: ./python/dbt-feldera
        run: uv cache prune --ci

  # Ideally this would just invoke `publish-python.yml`
  #
  # But not yet supported:
  # https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
  # https://github.com/pypa/gh-action-pypi-publish/issues/166
  # https://github.com/pypi/warehouse/issues/11096
  #
  # When this is solved, do this again:
  #  - name: ""
  #    uses: ./.github/workflows/publish-python.yml
  #    secrets: inherit
  publish-felderize:
    runs-on: ubuntu-latest-amd64
    environment:
      name: release
      url: https://pypi.org/p/felderize
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: ./python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2
        with:
          version: "0.11.3"
          enable-cache: true
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install and build felderize
        working-directory: ./python/felderize
        run: |
          uv venv
          uv pip install -e .
          uv build
      - name: Publish felderize
        if: ${{ vars.RELEASE_DRY_RUN == 'false' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: ./python/felderize/dist
      - name: Minimize uv cache
        working-directory: ./python/felderize
        run: uv cache prune --ci

  publish-crates:
    name: ""
    uses: ./.github/workflows/publish-crates.yml
    with:
      environment: release
    secrets: inherit

  adjust-versions:
    runs-on: [gke-runners-amd64]
    container:
      image: us-central1-docker.pkg.dev/feldera-ci/ghcr-remote/feldera/feldera-dev:sha-a5ab793b8d261068867b9fdfad3f04157b2536fc
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CI_ACCESS_APP_ID }}
          private-key: ${{ secrets.CI_ACCESS_APP_PKEY }}
          permission-contents: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # This runs on main because we make the commit on main at the end of the workflow,
          # we use the token so it can circument push to main protection rules
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Determine current version based on pipeline-manager
        run: |
          echo "CURRENT_VERSION=$(cargo metadata --no-deps | jq -r '.packages[]|select(.name == "pipeline-manager")|.version')" >> $GITHUB_ENV
      # A backport release (published from an old release branch) must not
      # bump main's version: main is already versions ahead of it. Bump only
      # when the published release is at least main's current version. A
      # manual workflow_dispatch carries no release tag and always bumps.
      - name: Check that the published release is not a backport
        id: bump-check
        env:
          RELEASED_TAG: ${{ github.event.release.tag_name }}
        run: |
          released="${RELEASED_TAG#v}"
          if [ -n "$released" ] && [ "$(printf '%s\n%s\n' "$released" "$CURRENT_VERSION" | sort -V | head -1)" = "$released" ] && [ "$released" != "$CURRENT_VERSION" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Release v$released is older than main's v$CURRENT_VERSION: skipping the version bump"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump cargo versions
        if: ${{ steps.bump-check.outputs.bump == 'true' }}
        run: |
          cargo set-version --bump ${{ vars.RELEASE_NEXT_VERSION }}
          cargo run --release --locked --bin pipeline-manager -- --dump-openapi
      - name: Determine next version based on pipeline-manager
        if: ${{ steps.bump-check.outputs.bump == 'true' }}
        run: |
          echo "NEXT_VERSION=$(cargo metadata --no-deps | jq -r '.packages[]|select(.name == "pipeline-manager")|.version')" >> $GITHUB_ENV
      - name: Adjust python version
        if: ${{ steps.bump-check.outputs.bump == 'true' }}
        working-directory: ./python
        run: |
          sed -i "s/version = \"${{ env.CURRENT_VERSION }}\"/version = \"${{ env.NEXT_VERSION }}\"/g" pyproject.toml
          uv sync
      - name: Adjust dbt-feldera version
        if: ${{ steps.bump-check.outputs.bump == 'true' }}
        working-directory: ./python/dbt-feldera
        run: |
          sed -i "s/version = \"${{ env.CURRENT_VERSION }}\"/version = \"${{ env.NEXT_VERSION }}\"/g" pyproject.toml
          sed -i "s/version: '${{ env.CURRENT_VERSION }}'/version: '${{ env.NEXT_VERSION }}'/g" dbt/include/feldera/dbt_project.yml
      - name: Adjust felderize version
        if: ${{ steps.bump-check.outputs.bump == 'true' }}
        working-directory: ./python/felderize
        run: |
          sed -i "s/version = \"${{ env.CURRENT_VERSION }}\"/version = \"${{ env.NEXT_VERSION }}\"/g" pyproject.toml
      - name: Adjust sql compiler version
        if: ${{ steps.bump-check.outputs.bump == 'true' }}
        working-directory: ./sql-to-dbsp-compiler/SQL-compiler
        run: |
          sed -i "s|<project.version>${{ env.CURRENT_VERSION }}|<project.version>${{ env.NEXT_VERSION }}|g" pom.xml
      - name: List changes
        if: ${{ steps.bump-check.outputs.bump == 'true' }}
        run: |
          git diff
      - uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # a94899bca583c204427a224a7af87c02f9b325d5
        if: ${{ vars.RELEASE_DRY_RUN == 'false' && steps.bump-check.outputs.bump == 'true' }}
        with:
          message: "ci: Prepare for v${{ env.NEXT_VERSION }}"
          push: origin main
