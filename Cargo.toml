[workspace.package]
authors = ["Feldera Team <dev@feldera.com>"]
version = "0.346.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/feldera/feldera"
repository = "https://github.com/feldera/feldera"
keywords = ["ivm", "analytics", "database", "incremental", "sql"]
readme = "README.md"
# Define Minimum Supported Rust Version (MSRV)
rust-version = "1.93.1"
edition = "2021"

[workspace]
members = [
  "crates/adapterlib",
  "crates/adapters",
  "crates/dbsp",
  "crates/feldera-macros",
  "crates/feldera-observability",
  "crates/fda",
  "crates/nexmark",
  "crates/feldera-types",
  "crates/pipeline-manager",
  "crates/sqllib",
  "sql-to-dbsp-compiler/lib/readers",
  "crates/datagen",
  "crates/iceberg",
  "crates/storage",
  "crates/rest-api",
  "crates/ir",
  "crates/fxp",
  "crates/storage-test-compat",
  "crates/buffer-cache",
  "crates/modular-bloom",
  "crates/samply"
]
exclude = [
  "sql-to-dbsp-compiler/temp",
  "sql-to-dbsp-compiler/experiments",
  "sql-to-dbsp-compiler/multi",
]
resolver = "2"

[workspace.dependencies]
actix = "0.13.1"
actix-codec = "0.5.0"
actix-cors = "0.7.1"
actix-files = "0.6.10"
actix-http = "3.12.1"
actix-test = "0.1.1"
actix-web = "4.11.0"
actix-web-httpauth = "0.8.0"
actix-web-static-files = "4.0.1"
actix-ws = "0.3.0"
ahash = "0.8"
anyhow = "1.0.91"
apache-avro = "0.18.0"
arc-swap = "1.5.1"
arcstr = "1.2.0"
arrow = "58"
arrow-json = "58"
arrow-schema = "58"
ascii_table = "=4.0.2"
async-channel = "2.3.1"
# Its default feature set selects ring; aws-lc-rs is the same choice made
# elsewhere in this workspace. The rest of the list restates the defaults, so
# revisit it when upgrading.
async-nats = { version = "0.47.0", default-features = false, features = [
    "server_2_10",
    "server_2_11",
    "server_2_12",
    "service",
    "aws-lc-rs",
    "jetstream",
    "nkeys",
    "crypto",
    "object-store",
    "kv",
    "websockets",
    "nuid",
] }
async-std = "1.12.0"
async-stream = "0.3.5"
async-trait = "0.1"
atomic = "0.6.0"
awc = "3.5.1"
aws-config = "1.8.13"
aws-sdk-dynamodb = { version = "1.110.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
  "behavior-version-latest"
] }
aws-sdk-s3 = { version = "1.122.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
  "sigv4a",
  "behavior-version-latest"
] }
aws-types = "1.1.7"
backoff = "0.4.0"
aws-lc-rs = "1.18.0"
rsa = { version = "0.9.10", features = ["std"] }
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "aws_lc_rs"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs"] }
base64 = "0.22.1"
base58 = "0.2.0"
binrw = "0.13.3"
blake3 = "1.8.2"
bstr = "0.2.1"
bytemuck = { version = "1.16.3", features = ["derive"] }
bytes = "1.11.1"
bytestring = "1.4.0"
change-detection = "1.2"
cached = { version = "0.43.0", features = ["async"] }
chrono = { version = "0.4.43", default-features = false }
chrono-tz = { version = "0.10.4" }
circular-queue = "0.2.6"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
colored = "3.0.0"
comfy-table = "7.1.3"
compare = "0.1.0"
core_affinity = "0.8.1"
crc32c = "0.6.4"
criterion = "0.5.1"
crossbeam = "0.8.4"
crossbeam-utils = "0.8.6"
csv = "1.2.2"
csv-core = "0.1.10"
dashmap = "6.1.0"
datafusion = "53.1"
dbsp = { path = "crates/dbsp", version = "0.346.0" }
# JSON functions applied to strings.
datafusion-functions-json = "0.53.1"
dbsp_nexmark = { path = "crates/nexmark" }
deadpool-postgres = "0.14.1"
# Feldera fork of delta-rs: upstream tag `rust-v0.32.3` + 6 patches, on branch
# `dv-async-load`. When bumping the pinned revision, preserve these patches:
#   - 7f8bb445 "Disable unsupported feature check." — relax the writer-side
#     protocol-feature gate so we can write tables produced by newer clients.
#   - 5b35c098 "delta-rs: round-robin pre-split unpartitioned scans into
#     target_partitions FileGroups" — improves snapshot read parallelism for
#     unpartitioned tables; pairs with the DataFusion knobs we tune in adapters.
#   - 297f2dd1 "delta-rs: resolve column-mapped Uniform/Iceberg columns by
#     Parquet field id." — fixes `col-<id> is missing from the physical schema`
#     when reading UC-Uniform-over-Iceberg tables (columnMapping.mode=id). #6557.
#   - 4913d02f "catalog-unity: refresh Unity Catalog S3 credentials before they
#     expire" — the vended temporary credentials last an hour, so a long-running
#     `uc://` pipeline failed with `ExpiredToken` without this.
#   - 943cf48b "delta-rs: load deletion vectors without the blocking pool":
#     planning a scan spawned one blocking task per deletion-vector file, and
#     each waited on a hand-off that needed a second thread from the same pool,
#     so a table with enough vectors deadlocked Tokio's pool for good. Reported
#     upstream with a standalone reproduction:
#     https://github.com/ryzhyk/delta-rs-dv-deadlock
#   - 78a5d066 "delta-rs: regression test for the deletion-vector blocking-pool
#     deadlock": eight vectors against four blocking threads, which wedges
#     without the patch above.
# Diff vs. upstream:
#   https://github.com/delta-io/delta-rs/compare/rust-v0.32.3...feldera:delta-rs:dv-async-load
deltalake = { git = "https://github.com/feldera/delta-rs.git", rev = "78a5d066d60feffcc7dcd9bae62d1c537dd9018c" }
deltalake-catalog-unity = { git = "https://github.com/feldera/delta-rs.git", rev = "78a5d066d60feffcc7dcd9bae62d1c537dd9018c" }

delta_kernel = { package = "buoyant_kernel", version = "0.22" }
derive_more = { version = "1.0.0" }
directories = "6.0"
dirs = "5.0"
dyn-clone = "1.0.17"
enum-map = "2.7.3"
erased-serde = "0.3.31"
fake = "2.10"
fastbloom = "0.14.0"
fdlimit = "0.3.0"
feldera-buffer-cache = { version = "0.346.0", path = "crates/buffer-cache" }
feldera-cloud1-client = "0.1.3"
feldera-datagen = { path = "crates/datagen" }
feldera-fxp = { version = "0.346.0", path = "crates/fxp", features = ["dbsp"] }
feldera-iceberg = { path = "crates/iceberg" }
feldera-observability = { version = "0.346.0", path = "crates/feldera-observability" }
feldera-macros = { version = "0.346.0", path = "crates/feldera-macros" }
feldera-modular-bloom = { version = "0.346.0", path = "crates/modular-bloom" }
feldera-sqllib = { version = "0.346.0", path = "crates/sqllib" }
feldera-storage = { version = "0.346.0", path = "crates/storage" }
feldera-types = { version = "0.346.0", path = "crates/feldera-types" }
feldera-rest-api = { version = "0.346.0", path = "crates/rest-api" }
feldera-ir = { version = "0.346.0", path = "crates/ir" }
feldera-adapterlib = { version = "0.346.0", path = "crates/adapterlib" }
feldera-samply = { version = "0.346.0", path = "crates/samply" }
flate2 = "1.1.0"
form_urlencoded = "1.2.0"
fs_extra = "1.3.0"
futures = "0.3.30"
futures-timer = "3.0.2"
futures-util = "0.3.30"
geo = "0.26.0"
google-cloud-gax = { package="gcloud-gax", version="1.3.2" }
google-cloud-googleapis = { package="gcloud-googleapis", version="1.3.0" }
# rustls-tls rather than the default default-tls, which pulls native-tls and
# with it the OpenSSL crate.
google-cloud-pubsub = { package = "gcloud-pubsub", version = "1.6.0", default-features = false, features = ["auth", "rustls-tls", "jwt-aws-lc-rs"] }
governor = "0.7.0"
hashbrown = "0.14.2"
hdrhist = "0.5"
hex = "0.4.3"
home = "=0.5.9"
http = "1.3.1"
# TODO: Use iceberg v0.10.0 when released
iceberg = { git = "https://github.com/feldera/iceberg-rust.git", rev = "28c4800f198686f306bd80d11d03f232670feec3" }
iceberg-catalog-glue = { git = "https://github.com/feldera/iceberg-rust.git", rev = "28c4800f198686f306bd80d11d03f232670feec3" }
iceberg-catalog-rest = { git = "https://github.com/feldera/iceberg-rust.git", rev = "28c4800f198686f306bd80d11d03f232670feec3" }
iceberg-catalog-s3tables = { git = "https://github.com/feldera/iceberg-rust.git", rev = "28c4800f198686f306bd80d11d03f232670feec3" }
iceberg-datafusion = { git = "https://github.com/feldera/iceberg-rust.git", rev = "28c4800f198686f306bd80d11d03f232670feec3" }
iceberg-storage-opendal = { git = "https://github.com/feldera/iceberg-rust.git", rev = "28c4800f198686f306bd80d11d03f232670feec3", features = ["opendal-s3", "opendal-gcs", "opendal-fs", "opendal-memory"] }
impl-trait-for-tuples = "0.2"
indexmap = "2.7.1"
indicatif = "0.17.0-rc.11"
indoc = "2.0.5"
inventory = "0.3"
itertools = "0.14.0"
jemalloc_pprof = "0.7.0"
json_to_table = "0.9.0"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
lexical-core = "1.0.5"
libc = "0.2.153"
like = "0.3.1"
log = "0.4.20"
md-5 = "0.10.6"
memory-stats = { version = "1.2.0", features = ["always_use_statm"] }
mach2 = "0.6.0"
metrics = "0.23.0"
metrics-exporter-prometheus = "0.15.3"
metrics-util = "0.17.0"
mimalloc-rust-sys = "1.7.2"
mime = "0.3.16"
mockall = "0.12.1"
nix = "0.29.0"
nonzero_ext = "0.3.0"
num = "0.4.1"
num-bigint = "0.4.6"
num-derive = "0.4.2"
num-format = "0.4.0"
num-traits = "0.2.19"
# 0.14 selects aws-lc-rs for request signing where 0.12 used ring.
object_store = "0.14.1"
once_cell = "1.20.2"
ordered-float = { version = "4.2.0", features = ["serde"] }
ouroboros = "0.18.4"
parquet = "58"
# The Parquet variant binary encoding, used to read and write Delta and
# Iceberg VARIANT columns. Released from arrow-rs alongside `parquet`, and
# sharing `arrow` with it, so keep the three on one point release.
parquet-variant = "58"
parquet-variant-compute = "58"
paste = "1.0.12"
petgraph = "0.6.0"
pg-client-config = "0.1.2"
pin-project-lite = "0.2.16"
postgres = "0.19.10"
# rustls rather than the default native-tls, which pulls the OpenSSL crate.
postgresql_embedded = { version = "0.20.0", default-features = false, features = ["bundled", "rustls", "theseus"] }
pprof = "0.15.0"
pretty_assertions = "1.4.0"
prettyplease = "0.2.22"
proc-macro2 = "1.0"
progenitor = "0.11.2"
progenitor-client = "0.11.2"
proptest = "1.5.0"
proptest-derive = "0.5.0"
proptest-state-machine = "0.3.0"
ptr_meta = "0.2.0"
quick_cache = "0.6.19"
r2d2 = "0.8.10"
rand = "0.8.6"
rand_chacha = "0.3.1"
rand_distr = "0.4.3"
rand_xoshiro = "0.6.0"
range-set = "0.0.11"
# Its default `libz` feature only configures the vendored librdkafka build,
# which `dynamic-linking` skips entirely; default-features has to be set here
# because a workspace member cannot override it on an inherited dependency.
rdkafka = { version = "0.39.0", default-features = false }
redis = "0.28.2"
refinery = { version = "0.9.2", default-features = false }
regex = "1.10.2"
# default-features off drops default-tls, which pulls native-tls and with it the
# OpenSSL crate; every consumer here uses rustls instead.
# The -no-provider variant leaves the rustls provider to the process default,
# which every binary here installs as aws-lc-rs; the plain feature would pin
# ring instead.
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots-no-provider", "charset", "http2", "macos-system-configuration"] }
reqwest-websocket = "0.5.0"
rkyv = { version = "0.7.45", default-features = false }
rmp-serde = "1.3.0"
rmpv = "1.3.0"
# Pin `roaring` exactly because the crate only supports the current stable
# Rust and may start requiring newer compiler features in patch releases.
roaring = "=0.11.4"
rstest = "0.15"
# Make sure this is the same rustls version used by the `tonic` crate.
# See the `ensure_default_crypto_provider` function.
rustls = "0.23.12"
rustls-pemfile = "2.2.0"
rustls-native-certs = "0.7.3"
rustversion = "1.0"
rustyline = "15.0"
ryu = "1.0.20"
schema_registry_converter = { version = "4.2.0", default-features = false }
semver = "1.0.27"
serde = "1.0.213"
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
# serde_arrow fork that recognizes the "+00:00" timezone Iceberg uses for
# `timestamptz` columns (upstream 0.14.2 accepts only the name "UTC").
# Remove the git source when https://github.com/chmp/serde_arrow/pull/320
# is released. `version` keeps the crates that depend on serde_arrow
# publishable to crates.io; cargo drops the git source when publishing.
# The git source goes on the dependency rather than in a `[patch]` section
# because patches do not apply to generated SQL pipeline workspaces, which
# import this dependency through `crates/adapters`.
serde_arrow = { version = "0.14.2", git = "https://github.com/ryzhyk/serde_arrow.git", rev = "9555b34fb85d4323e4381ad5a09872c1696a0d34", features = ["arrow-58"] }
serde_bytes = "0.11.15"
serde_json = { version = "1.0.132", features = ["arbitrary_precision"] }
serde_json_path_to_error = "0.1.5"
seq-macro = "0.3.6"
serde_urlencoded = "0.7.1"
serde_with = "3.0.0"
serde_yaml = "0.9.34"
serial_test = "3"
sha2 = "0.10.8"
size-of = { version = "0.1.7", features = [
    "time-std",
    "ordered-float",
], package = "feldera-size-of" }
sltsqlvalue = { path = "sql-to-dbsp-compiler/lib/sltsqlvalue" }
smallvec = { version = "1.15.0", features = ["serde", "write"] }
smallstr = "0.3.0"
snap = "1.1.1"
static-files = "0.2.3"
static_assertions = "1.1.0"
syn = "2.0.77"
sysinfo = "0.38.4"
tabled = "0.17"
tar = "0.4.46"
tarpc = "0.38.0"
tempfile = "3.21"
termbg = "0.5.1"
test_bin = "0.4.0"
textwrap = "0.15.0"
thiserror = "2"
threadpool = "1.8.1"
thread-id = "5.0.0"
tikv-jemallocator = "0.6.0"
time = { version = "0.3.47", features = ["serde", "serde-well-known"] }
tokio = "1.50.0"
tokio-postgres = "0.7"
tokio-stream = "0.1.18"
tokio-util = "0.7.11"
tracing = "0.1.40"
tracing-subscriber = "0.3.20"
tracing-log = "0.2.0"
typedmap = "0.3.0"
url = { version = "2.5.0", features = ["serde"] }
urlencoding = "2.1.3"
utoipa = { version = "4.2", features = ["uuid", "chrono"] }
uuid = { version = "1.17.0", features = ["serde"] }
vergen-gitcl = "1.0.0"
wiremock = "0.6"
xxhash-rust = "0.8.6"
zip = "6.0.0"
zstd = "0.12.0"
backtrace = "0.3.75"
parking_lot = "0.12.4"
etl = { git = "https://github.com/feldera/etl", rev = "91260556931fba2f55db9ebc11775e295c453bc9" }
etl-config = { git = "https://github.com/feldera/etl", rev = "91260556931fba2f55db9ebc11775e295c453bc9" }
etl-postgres = { git = "https://github.com/feldera/etl", rev = "91260556931fba2f55db9ebc11775e295c453bc9" }

[workspace.metadata.release]
release = false

[profile.bench]
debug = true

[profile.release]
debug = "line-tables-only"
