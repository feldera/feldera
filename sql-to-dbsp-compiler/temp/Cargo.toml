[package]
name = "temp"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# Catalog-mode tests (CatalogTests) reference dbsp_adapters::Catalog; handles-mode
# tests do not, and leaving adapters out of their build removes 220 crates from the
# dependency graph.
catalog = ["dbsp_adapters"]
# A UDF that implements a pre- or postprocessor uses adapterlib directly
adapterlib = ["feldera-adapterlib"]

[dependencies]
anyhow = { version = "1.0.91" }
arcstr = { version = "1.2.0" }
paste = { version = "1.0.12" }
derive_more = { version = "1.0.0", features = ["add", "not", "from"] }
dbsp = { path = "../../crates/dbsp", features = ["backend-mode"] }
dbsp_adapters = { path = "../../crates/adapters", default-features = false, optional = true }
feldera-adapterlib = { path = "../../crates/adapterlib", optional = true }
feldera-types = { path = "../../crates/feldera-types" }
feldera-sqllib = { path = "../../crates/sqllib" }
feldera-macros = { path = "../../crates/feldera-macros" }
serde = { version = "1.0.213", features = ["derive"] }
compare = { version = "0.1.0" }
size-of = { version = "0.1.7", package = "feldera-size-of" }
serde_json = { version = "1.0.132", features = ["arbitrary_precision"] }
rkyv = { version = "0.7.45", default-features = false, features = ["std", "size_64"] }
erased-serde = { version = "0.3.31" }
seq-macro = { version = "0.3.6" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6.0", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
hashing = { path = "../lib/hashing" }
readers = { path = "../lib/readers" }
uuid = { version = "1.17.0" }
# Used only in some unit tests
metrics = { version = "0.23.0" }
metrics-util = { version = "0.17.0" }
sltsqlvalue = { path = "../lib/sltsqlvalue" }

[lib]
path = "src/lib.rs"
doctest = false

# The test profile inherits this one. Full debug info accounts for ~90% of the
# bytes written per test class, mostly .debug_str filled with generated tuple
# type names; line tables keep panic backtraces useful at a fraction of the size.
[profile.dev]
debug = "line-tables-only"
