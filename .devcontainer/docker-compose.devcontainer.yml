services:
  workspace:
    build:
      context: .
      # Note that the path of the Dockerfile and context is relative to the *primary*
      # docker-compose.yml file (the first in the devcontainer.json "dockerComposeFile"
      # array).
      dockerfile: Dockerfile
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    pids_limit: -1
    environment:
      - RUST_BACKTRACE=1
      - REDPANDA_BROKERS=redpanda:9092
    volumes:
      # The repository, at the path devcontainer.json names as workspaceFolder.
      # Mounting it here rather than from devcontainer.json keeps the compose
      # file usable on its own, e.g. `podman compose up`.
      - ../:/workspaces/feldera
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - PERFMON
      - IPC_LOCK
    security_opt:
      - seccomp:unconfined
      # Without this an SELinux-enforcing host denies the container access to
      # the bind-mounted repository. It is a no-op everywhere else, and the
      # alternative, a `:z` on the mount, relabels the whole tree on the host.
      - label=disable
    ulimits:
      memlock:
        soft: -1
        hard: -1
  postgres-dev:
    image: postgres:15-alpine
    restart: always
    # Logical replication for the Postgres CDC connector tests.
    command: postgres -c wal_level=logical
    ports:
      - 5435:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/pg/data
  db-admin:
    image: adminer:5-standalone
    restart: always
    ports:
      - 5436:8080