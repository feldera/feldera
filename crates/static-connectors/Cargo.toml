[package]
name = "static-connectors"
description = "The connector runtime of feldera pipelines that the SQL compiler compiles to Rust, on the DBSP engine"
publish = false
categories = ["database", "api-bindings", "network-programming"]
keywords = { workspace = true }
edition = "2024"
version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[features]
default = [
    "with-kafka",
    "with-deltalake",
    "with-iceberg",
    "with-avro",
    "with-nexmark",
    "with-pubsub",
    "with-redis",
    "with-nats",
    "with-postgres-cdc",
    "with-dynamodb",
    "with-heap-profiling",
    "with-s2",
]
with-kafka = ["dbsp_adapters/with-kafka"]
with-deltalake = ["dbsp_adapters/with-deltalake"]
with-iceberg = ["dbsp_adapters/with-iceberg"]
with-avro = ["dbsp_adapters/with-avro", "feldera-adapterlib/with-avro", "dep:apache-avro"]
with-nexmark = ["dep:dbsp_nexmark"]
with-pubsub = ["dbsp_adapters/with-pubsub"]
with-redis = ["dbsp_adapters/with-redis"]
with-nats = ["dbsp_adapters/with-nats"]
with-postgres-cdc = ["dbsp_adapters/with-postgres-cdc"]
with-dynamodb = [
    "dbsp_adapters/with-dynamodb",
    "feldera-adapterlib/with-dynamodb",
    "dep:aws-sdk-dynamodb",
    "dep:serde_dynamo",
]
with-heap-profiling = ["dbsp_adapters/with-heap-profiling"]
with-s2 = ["dbsp_adapters/with-s2"]
feldera-enterprise = ["dbsp_adapters/feldera-enterprise"]
# The test features of the connector suites, which run from this crate's tests. See
# `crates/adapters/Cargo.toml`.
delta-s3-test = ["dbsp_adapters/delta-s3-test"]
delta-unity-test = ["dbsp_adapters/delta-unity-test"]
pubsub-emulator-test = ["dbsp_adapters/pubsub-emulator-test"]
pubsub-gcp-test = ["dbsp_adapters/pubsub-gcp-test"]
iceberg-tests-fs = ["dbsp_adapters/iceberg-tests-fs"]
iceberg-tests-glue = ["dbsp_adapters/iceberg-tests-glue"]
iceberg-tests-rest = ["dbsp_adapters/iceberg-tests-rest"]
iceberg-tests-s3tables = ["dbsp_adapters/iceberg-tests-s3tables"]
iceberg-tests-follow = ["dbsp_adapters/iceberg-tests-follow"]
fips = ["dbsp_adapters/fips"]
bench-mode = ["dbsp_adapters/bench-mode"]
# The static engine's test fixture, `test::StaticTestEngine`, for the `connector_suites` test
# target, which runs the connector suites of `dbsp_adapters`. This crate's dev-dependency on
# itself turns it on, so a plain `cargo test` builds the target.
testing = [
    "dbsp_adapters/testing",
    "feldera-adapterlib/testing",
    "dep:feldera-macros",
    "dep:postgres",
    "dep:proptest",
    "dep:proptest-derive",
    "dep:rkyv",
    "dep:size-of",
    "dep:tempfile",
]

[dependencies]
# Without default features, so that a crate that turns off this crate's default features
# drops the connectors too.
dbsp_adapters = { path = "../adapters", default-features = false }
dbsp = { workspace = true }
dbsp_nexmark = { workspace = true, optional = true }
feldera-adapterlib = { workspace = true }
feldera-ir = { workspace = true }
feldera-sqllib = { workspace = true }
feldera-storage = { workspace = true }
feldera-types = { workspace = true }
anyhow = { workspace = true, features = ["backtrace"] }
apache-avro = { workspace = true, optional = true }
arrow = { workspace = true, features = ["chrono-tz"] }
aws-sdk-dynamodb = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
crossbeam = { workspace = true }
csv = { workspace = true }
dyn-clone = { workspace = true }
enum-map = { workspace = true }
erased-serde = { workspace = true }
inventory = { workspace = true }
num-bigint = { workspace = true }
rand = { workspace = true, features = ["small_rng"] }
rmp-serde = { workspace = true }
rmpv = { workspace = true, features = ["with-serde"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_arrow = { workspace = true }
serde_dynamo = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_json_path_to_error = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "std"] }
xxhash-rust = { workspace = true, features = ["xxh3"] }
# The test fixture's dependencies, behind `testing`.
feldera-macros = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
rkyv = { workspace = true, features = ["std", "size_64"], optional = true }
size-of = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
static-connectors = { path = ".", default-features = false, features = ["testing"] }
dbsp_adapters = { path = "../adapters", default-features = false, features = ["testing"] }
feldera-adapterlib = { workspace = true, features = ["testing"] }
feldera-macros = { workspace = true }
bstr = { workspace = true, features = ["serde1"] }
criterion = { workspace = true }
csv-core = { workspace = true }
datafusion = { workspace = true }
deltalake = { workspace = true, features = ["datafusion"] }
itertools = { workspace = true }
parquet = { workspace = true, features = ["json"] }
parquet-variant = { workspace = true }
parquet-variant-compute = { workspace = true }
postgres = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
proptest-derive = { workspace = true }
rkyv = { workspace = true, features = ["std", "size_64"] }
serial_test = { workspace = true }
size-of = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

# The connector suites of `dbsp_adapters`, each case one test, on the static engine.
[[test]]
name = "connector_suites"
harness = false

[[bench]]
name = "avro_encoder"
harness = false
required-features = ["with-avro"]

[[bench]]
name = "postgres_output"
harness = false
required-features = ["bench-mode"]

[[bench]]
name = "delta_encoder"
harness = false

[[bench]]
name = "delta_merge"
harness = false
