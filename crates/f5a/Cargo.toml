[package]
name = "f5a"
description = "A k9s-style interactive terminal console for Feldera"
readme = "README.md"
publish = false
edition = "2024"
version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
clap = { workspace = true, features = ["color"] }
crossterm = { workspace = true, features = ["event-stream"] }
dirs = { workspace = true }
feldera-rest-api = { workspace = true }
feldera-types = { workspace = true }
futures = { workspace = true }
ratatui = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "process"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "net", "io-util"] }
wiremock = { workspace = true }
